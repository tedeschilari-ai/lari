<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Treino da Lari</title>
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Treino">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Treino da Lari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de treino em preto e branco. Celular: telas empilhadas + nav flutuante preta em pílula. Desktop: menu lateral + coluna de 760px. Cartões brancos bem arredondados sobre cinza claro; o "cartão invertido" (preto no claro, branco no escuro) marca o treino do dia. */
:root{
  --bg:#ECECEC; --surface:#FFFFFF; --sunk:#F2F2F2; --ink:#0D0D0D; --muted:#6E6E6E; --line:#E2E2E2;
  --inv:#0D0D0D; --on-inv:#FFFFFF; --inv-muted:#9C9C9C; --inv-sunk:#262626;
  --up:#1F8A4D; --hold:#A36A12; --warn:#C2412D;
  --f:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:24px; --shadow:0 1px 2px rgb(0 0 0 / .04),0 8px 24px rgb(0 0 0 / .05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0A0A; --surface:#161616; --sunk:#202020; --ink:#F2F2F2; --muted:#9A9A9A; --line:#2A2A2A;
  --inv:#F2F2F2; --on-inv:#0A0A0A; --inv-muted:#5E5E5E; --inv-sunk:#DADADA;
  --up:#4CC685; --hold:#E2A64E; --warn:#F07A62; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#161616; --sunk:#202020; --ink:#F2F2F2; --muted:#9A9A9A; --line:#2A2A2A;
  --inv:#F2F2F2; --on-inv:#0A0A0A; --inv-muted:#5E5E5E; --inv-sunk:#DADADA;
  --up:#4CC685; --hold:#E2A64E; --warn:#F07A62; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.87rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
.side{display:none}
.content{width:100%;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;min-width:0}
nav.dock{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 32px));background:var(--inv);color:var(--on-inv);border-radius:999px;padding:7px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;box-shadow:0 10px 30px rgb(0 0 0 / .22)}
nav.dock a{display:flex;align-items:center;justify-content:center;gap:6px;height:46px;border-radius:999px;text-decoration:none;color:var(--inv-muted);font-weight:700;font-size:.78rem;min-width:0}
nav.dock a span{display:none}
nav.dock a.on{background:var(--on-inv);color:var(--inv)}
nav.dock a.on span{display:inline}
nav.dock a.on{grid-column:span 1}
@media (max-width:380px){nav.dock a.on span{display:none}}
.side a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;text-decoration:none;color:var(--muted);font-weight:700}
.side a:hover{background:var(--sunk)}
.side a.on{background:var(--inv);color:var(--on-inv)}
@media (min-width:900px){
  .shell{grid-template-columns:260px 1fr}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:26px 16px;border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;font-weight:800;font-size:1.1rem}
  .side .phase{margin-top:auto;padding:16px;border-radius:20px;background:var(--sunk);display:flex;flex-direction:column;gap:6px}
  nav.dock{display:none}
  .content{padding-block:32px 56px}
}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--inv);color:var(--on-inv);display:grid;place-items:center;font-weight:800;flex:none}

/* header */
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello .who{display:flex;align-items:center;gap:12px;min-width:0}
.hello .who div{display:flex;flex-direction:column;min-width:0}
.hello .who b{font-size:1.05rem}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;text-decoration:none;color:var(--ink)}
.big{font-size:2.05rem}
@media (min-width:640px){.big{font-size:2.5rem}}

/* buttons, pills */
.btn{border:0;border-radius:999px;padding:14px 22px;font-weight:800;background:var(--inv);color:var(--on-inv);font-size:.98rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.light{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.onv{background:var(--on-inv);color:var(--inv)}
.btn.small{padding:9px 15px;font-size:.86rem}
.btn.block{width:100%}
.btn .ico{width:18px;height:18px}
.btn:disabled{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:700;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.pill.dark{background:var(--inv);color:var(--on-inv);border-color:var(--inv)}
.pill.soft{background:var(--sunk);border-color:var(--sunk)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin-inline:-2px}
.chips::-webkit-scrollbar{display:none}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:700;font-size:.88rem;white-space:nowrap;color:var(--ink)}
.chips button.on{background:var(--inv);color:var(--on-inv);border-color:var(--inv)}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:800;font-size:.85rem;color:var(--muted)}
.seg button.on{background:var(--inv);color:var(--on-inv)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dp{border:0;background:var(--surface);border-radius:18px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;box-shadow:var(--shadow)}
.dp .dn{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:capitalize}
.dp .dd{font-size:1.1rem;font-weight:800;line-height:1}
.dp .dt{font-size:.6rem;font-weight:800;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.dp .dot{width:5px;height:5px;border-radius:9px;background:transparent}
.dp .dot.on{background:var(--up)}
.dp.today:not(.sel){outline:2px solid var(--ink);outline-offset:-2px}
.dp.sel{background:var(--inv);color:var(--on-inv)}
.dp.sel .dn,.dp.sel .dt{color:var(--inv-muted)}
.weeknav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.linkbtn{background:none;border:0;padding:4px 0;font-weight:800;font-size:.86rem;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.beach{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border-radius:20px;padding:10px 10px 10px 16px;box-shadow:var(--shadow)}
.beach b{font-size:.92rem}

/* cards */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px;display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 2px}
.sec-h h2{font-size:1.25rem}
.inv{background:var(--inv);color:var(--on-inv)}
.inv .eyebrow,.inv .muted{color:var(--inv-muted)}
.note{background:var(--surface);border-radius:18px;padding:12px 14px;font-size:.9rem;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow)}
.note .ico{width:18px;height:18px;margin-top:2px}

/* hero */
.hero{border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.hero-top{display:grid;grid-template-columns:1fr 132px;gap:8px;align-items:center}
.hero h2{font-size:2.1rem;margin-top:4px}
.hero p{color:var(--inv-muted);font-size:.92rem;margin-top:4px}
.hero-fig{width:132px;height:100px;border-radius:20px;background:var(--inv-sunk);overflow:hidden}
.hero-fig svg{width:100%;height:100%;display:block}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hstats div{background:var(--inv-sunk);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column}
.hstats b{font-size:1.35rem;line-height:1.1}
.hstats span{font-size:.72rem;color:var(--inv-muted);font-weight:600}
.inv .hstats div{color:var(--on-inv)}
.bar{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:9px}
.inv .bar{background:var(--inv-sunk)} .inv .bar i{background:var(--on-inv)}
.clock{font-size:2.3rem;font-weight:800;letter-spacing:-.02em;line-height:1}

/* list items */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:68px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 14px 10px 10px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);border:0;width:100%;text-align:left;color:var(--ink)}
.item.sm{grid-template-columns:56px minmax(0,1fr) auto}
.thumb{width:68px;height:62px;border-radius:16px;background:var(--sunk);overflow:hidden;display:block}
.item.sm .thumb{width:56px;height:50px;border-radius:14px}
.thumb svg{width:100%;height:100%;display:block}
.item .info{display:flex;flex-direction:column;gap:4px;min-width:0}
.item .info b{font-size:1rem;line-height:1.2}
.item .info .sub{font-size:.82rem;color:var(--muted)}
.item .prog{display:flex;align-items:center;gap:8px}
.item .prog .bar{flex:1;max-width:150px}
.item .prog .pc{font-size:.66rem;font-weight:800;background:var(--inv);color:var(--on-inv);border-radius:6px;padding:1px 5px}
.item.skip{opacity:.5}
.tick{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;background:var(--surface);color:var(--muted);flex:none}
.tick.on{background:var(--inv);border-color:var(--inv);color:var(--on-inv)}
.tick svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chev{color:var(--muted)}
.mobrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding-right:12px}
.mobrow .item{box-shadow:none;background:transparent;padding-right:4px;grid-template-columns:56px minmax(0,1fr)}
.blabel{display:flex;align-items:center;gap:8px;padding:4px 4px 0;font-size:.74rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.blabel .t{margin-left:auto;max-width:62%;text-transform:none;letter-spacing:0;font-weight:700;color:var(--ink);font-size:.78rem;text-align:right}
.biset{display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:26px;border:1.5px dashed var(--line)}
.biset .item{box-shadow:none}
details.why{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px}
details.why summary{list-style:none;cursor:pointer;font-weight:800;display:flex;justify-content:space-between;align-items:center}
details.why summary::-webkit-details-marker{display:none}
details.why summary::after{content:"+";font-size:1.2rem}
details.why[open] summary::after{content:"−"}
details.why p{margin-top:8px;font-size:.92rem;color:var(--muted);max-width:65ch}

/* detalhe */
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dhead .t{font-weight:800;font-size:.95rem;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.media{position:relative;background:var(--surface);border-radius:28px;overflow:hidden;aspect-ratio:4/3;max-width:100%;box-shadow:var(--shadow)}
@media (min-width:640px){.media{aspect-ratio:16/10}}
.media svg{width:100%;height:100%;display:block}
.media img,.media video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.media .lbl{position:absolute;left:14px;bottom:14px}
.media .yt{position:absolute;right:14px;top:14px;text-decoration:none}
.dtitle{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dtitle h1{font-size:1.75rem}
.steps{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
.step{flex:0 0 min(78%,300px);scroll-snap-align:start;background:var(--surface);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.step b{font-size:.92rem}
.step p{font-size:.9rem;color:var(--muted)}
.step.alt{background:var(--sunk);box-shadow:none}
.last{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:16px;background:var(--sunk)}
.last .vals{font-weight:800}
.sug{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;padding:12px 14px;border-radius:16px;background:var(--sunk)}
.sug .k{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:999px;flex:none;color:#fff}
.sug.up .k{background:var(--up)} .sug.hold .k{background:var(--hold)} .sug.warn .k{background:var(--warn)} .sug.new .k{background:var(--inv);color:var(--on-inv)}
.sets{display:grid;grid-template-columns:20px 62px minmax(0,1fr) minmax(0,1fr) 46px;gap:7px;align-items:center}
.sets .prev{font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setbtns{display:flex;gap:18px;flex-wrap:wrap}
.sets .h{font-size:.66rem;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.sets .n{font-size:.85rem;font-weight:800;color:var(--muted);text-align:center}
.sets input{width:100%;min-width:0;padding:13px 10px;border:1px solid var(--line);border-radius:14px;background:var(--sunk);font-size:1.05rem;font-weight:700}
.sets input::placeholder{color:var(--muted);opacity:.55;font-weight:600}
.okb{width:46px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.okb.on{background:var(--inv);border-color:var(--inv);color:var(--on-inv)}
.okb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
textarea,.input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--sunk);font-size:.93rem}
textarea{min-height:48px;resize:vertical}
.nextc{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px 10px 10px;border-radius:22px;background:var(--surface);border:0;width:100%;text-align:left;box-shadow:var(--shadow);color:var(--ink)}
.filebtn{position:relative;overflow:hidden}
.nx-photo{width:64px;height:64px;border-radius:14px;object-fit:cover;flex:none}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* descanso */
.rest{position:fixed;z-index:35;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 32px));border-radius:24px;padding:10px 10px 10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgb(0 0 0 / .25)}
.rest .ring{width:56px;height:56px;flex:none;position:relative}
.rest .ring svg{width:56px;height:56px;transform:rotate(-90deg)}
.rest .ring circle{fill:none;stroke-width:5}
.rest .ring .bg{stroke:var(--inv-sunk)} .rest .ring .fg{stroke:var(--on-inv);stroke-linecap:round}
.rest .tm{font-size:1.4rem;font-weight:800;line-height:1}
.rest .lb{font-size:.75rem;color:var(--inv-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.rest .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rest button{border:0;border-radius:999px;padding:10px 12px;font-weight:800;font-size:.82rem;background:var(--inv-sunk);color:var(--on-inv)}
.rest button.w{background:var(--on-inv);color:var(--inv)}
@media (min-width:900px){.rest{bottom:24px;left:calc(50% + 130px)}}
.live{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:25;align-self:center;display:flex;align-items:center;gap:10px;border-radius:999px;padding:6px 6px 6px 14px;box-shadow:0 6px 20px rgb(0 0 0 / .18);font-weight:800;font-size:.9rem;border:0}
.live i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
@media (prefers-reduced-motion:no-preference){.live i{animation:pulse 1.4s infinite}}
@keyframes pulse{50%{opacity:.25}}
.live .btn{padding:7px 12px;font-size:.8rem}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding-top:18px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);align-self:center}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:28px}}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--surface);border:0;text-align:left;width:100%;color:var(--ink)}
.opt.on{outline:2px solid var(--ink);outline-offset:-2px}
.opt span{display:flex;flex-direction:column}
.opt small{color:var(--muted);font-size:.82rem}
.pips{display:flex;gap:8px}
.pips button{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:800}
.pips button.on{background:var(--inv);color:var(--on-inv);border-color:var(--inv)}
input[type=range]{width:100%;accent-color:var(--ink)}

/* outras telas */
.restday{border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:12px}
.restday h2{font-size:2rem}
.wk{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px 12px 12px;border:0;background:var(--surface);border-radius:22px;text-align:left;width:100%;box-shadow:var(--shadow);color:var(--ink)}
.wk .d{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--sunk);border-radius:16px;height:54px}
.wk .d b{font-size:1.1rem;line-height:1}
.wk .d span{font-size:.64rem;font-weight:800;color:var(--muted);text-transform:uppercase}
.wk .w{display:flex;flex-direction:column;gap:2px;min-width:0}
.wk .w span{font-size:.84rem;color:var(--muted)}
.tag{font-size:.7rem;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}

  const KS='calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" dur="2.8s" repeatCount="indefinite"';
  const at=(n,a,b)=>`${n}="${go?a:b}"`;
  const an=(n,a,b)=>go&&a!==b?`<animate attributeName="${n}" values="${a};${b};${a}" ${KS}/>`:"";
  const root=(P,j)=>{const arm=j==="e"||j==="e2", base=P[arm?"s":"p"];
    if(!F.fv) return base; const off=arm?7:4; return [base[0]+(P[j][0]<base[0]?-off:off),base[1]]};
  const line=(cls,a1,b1,a2,b2,style)=>`<line class="${cls}"${style?` style="${style}"`:""} ${at("x1",a1[0],a2[0])} ${at("y1",a1[1],a2[1])} ${at("x2",b1[0],b2[0])} ${at("y2",b1[1],b2[1])}>${an("x1",a1[0],a2[0])}${an("y1",a1[1],a2[1])}${an("x2",b1[0],b2[0])}${an("y2",b1[1],b2[1])}</line>`;
  const circ=(cls,c1,c2,r,style)=>`<circle class="${cls}"${style?` style="${style}"`:""} r="${r}" ${at("cx",c1[0],c2[0])} ${at("cy",c1[1],c2[1])}>${an("cx",c1[0],c2[0])}${an("cy",c1[1],c2[1])}</circle>`;
  let s=`<svg class="fig" viewBox="0 0 120 90" aria-hidden="true"><line class="fl" x1="4" y1="87" x2="116" y2="87"/>`;
  (F.st||[]).forEach(e=>{
    if(e[0]==="r") s+=`<rect class="eqf" x="${e[1]}" y="${e[2]}" width="${e[3]}" height="${e[4]}" rx="2"/>`;
    else if(e[0]==="c") s+=`<circle class="eqf" cx="${e[1]}" cy="${e[2]}" r="${e[3]}" style="opacity:.5"/>`;

  });

  [["e2","w2"],["k2","a2"]].forEach(([m,n])=>{if(A[m]){s+=line("b2",root(A,m),A[m],root(B,m),B[m])+line("b2",A[m],A[n],B[m],B[n])}});

function setDone(s){return s.ok&&num(s.reps)!=null}

function sesStats(h){let sets=0,vol=0;(h.itens||[]).forEach(it=>{workSets(it).forEach(s=>{sets++;vol+=(num(s.kg)||0)*(num(s.reps)||0)})});return {sets,vol}}
function prevItem(exId,h){
  const t=h?Date.parse(h.inicio):Infinity;
  for(const s of sessions()){ if(h&&s.id===h.id) continue; if(Date.parse(s.inicio)>=t) continue;
    const it=(s.itens||[]).find(i=>i.ex===exId&&(i.sets||[]).some(setDone)); if(it) return {ses:s,it}; }
  return null;
}
function bestOf(sets,tipo){
  let b=null;
  (sets||[]).forEach(x=>{if(!setDone(x)||x.t==="a")return;const k=num(x.kg)||0,r=num(x.reps)||0;
    if(!b||(tipo==="tempo"||tipo==="corpo"&&!k&&!b.kg?r>b.reps:(k>b.kg||k===b.kg&&r>b.reps)))b={kg:k,reps:r}});
  return b;
}
function refFor(exId,h,tipo){
  const pv=prevItem(exId,h), last=pv?bestOf(pv.it.sets,tipo)||bestOf(pv.it.sets.map(x=>Object.assign({},x,{t:"n"})),tipo):null;
  let rec=null; const t=h?Date.parse(h.inicio):Infinity;
  sessions().forEach(s=>{if(h&&s.id===h.id)return;if(Date.parse(s.inicio)>=t)return;(s.itens||[]).filter(i=>i.ex===exId).forEach(it=>{const b=bestOf(it.sets,tipo);if(b&&(!rec||(tipo==="tempo"?b.reps>rec.reps:(b.kg>rec.kg||b.kg===rec.kg&&b.reps>rec.reps))))rec=Object.assign(b,{data:s.data})})});
  return {pv,last,rec};
}
const fmtSet=(b,tipo)=>tipo==="tempo"?b.reps+" s":(b.kg?fmtN(b.kg)+" kg × ":"")+b.reps+(b.kg?"":" reps");
function exHistory(exId){
  const out=[];
  sessions().slice().reverse().forEach(s=>{(s.itens||[]).filter(i=>i.ex===exId).forEach(it=>{
    const ws=workSets(it); if(!ws.length) return;
    let kg=0,reps=0,vol=0,e1=0;
    ws.forEach(x=>{const k=num(x.kg)||0,r=num(x.reps)||0;kg=Math.max(kg,k);reps=Math.max(reps,r);vol+=k*r;e1=Math.max(e1,k?k*(1+r/30):0)});
    out.push({date:s.data,ses:s,it,kg,reps,vol,e1});
  })});
  return out;
}
function nextTreino(r){
  if(!r||!r.treinos||!r.treinos.length) return null;
  const last=sessions().find(s=>s.rotina===r.id&&s.treino);
  if(!last) return r.treinos[0];
  const i=r.treinos.findIndex(t=>t.id===last.treino);
  return r.treinos[(i+1)%r.treinos.length]||r.treinos[0];
}
function usedIn(exId){const out=[];rotList().forEach(r=>(r.treinos||[]).forEach((t,i)=>{if((t.itens||[]).some(it=>it.ex===exId))out.push(r.nome+" · Treino "+letter(i))}));return out}

/* ---------- navegação ---------- */
const VIEWS=["inicio","rotinas","exercicios","evolucao","historico","ajustes"];
function go(h){if(location.hash==="#"+h)route();else location.hash=h}
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  let m;
  S.param=null;
  if((m=h.match(/^ses-(.+)$/))){S.view="ses";S.param=m[1]}
  else if((m=h.match(/^trn-([a-z0-9]+)-([a-z0-9]+)$/))){S.view="trn";S.param=[m[1],m[2]]}
  else if((m=h.match(/^rot-([a-z0-9]+)$/))){S.view="rot";S.param=m[1]}
  else if((m=h.match(/^exedit-(.+)$/))){S.view="exedit";S.param=m[1];S.form=null}
  else if((m=h.match(/^ex-(.+)$/))){S.view="ex";S.param=m[1]}
  else S.view=VIEWS.includes(h)?h:"inicio";
  render();window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
function tabOf(v){return {ses:"inicio",trn:"rotinas",rot:"rotinas",exedit:"exercicios",ex:"exercicios"}[v]||v}

/* ---------- shell e render ---------- */
function shell(){
  const cur=tabOf(S.view);
  document.getElementById("dock").innerHTML=NAV.map(([v,n])=>`<a href="#${v}" class="${cur===v?"on":""}" aria-label="${n}" title="${n}">${I(v)}</a>`).join("");
  document.getElementById("sidenav").innerHTML=NAV.map(([v,n])=>`<a href="#${v}" class="${cur===v?"on":""}">${I(v)}${n}</a>`).join("");
  const L=live(); const sl=document.getElementById("sidelive");

  sl.hidden=!L;

function render(){
  const a=document.activeElement;
  if(a&&app.contains(a)&&((a.tagName==="INPUT"&&!["checkbox","range","file"].includes(a.type))||a.tagName==="TEXTAREA")){S.pending=true;return}
  S.pending=false;
  shell();
  document.getElementById("dock").hidden=!S.token;document.querySelector(".side").hidden=!S.token;
  if(!S.token){app.innerHTML=vSetup();bindSetup();return}
  if(S.ok===false){const st=S.loadErr&&S.loadErr.status;app.innerHTML=`<div class="banner card"><span>${st===401?"A chave do GitHub não vale mais. Desconecte em Ajustes e conecte de novo.":st===403||st===404?"A chave não tem acesso ao repositório lari-dados.":"Não consegui carregar seus dados do GitHub. Confira a internet."}</span><button class="btn small" onclick="location.reload()">Tentar de novo</button> <a class="btn light small" href="#ajustes">Ajustes</a></div>`;if(S.view==="ajustes"){app.innerHTML=vAjustes();bindAjustes()}return}
  if(!S.loaded.exercicios||!S.loaded.rotinas||!S.loaded.historico) return;
  const y=window.scrollY;
  const V={ajustes:vAjustes,inicio:vInicio,rotinas:vRotinas,rot:vRot,trn:vTrn,exercicios:vExs,ex:vEx,exedit:vExEdit,evolucao:vEvo,historico:vHist,ses:vSes};

  bind();bindAjustes();fixMedia();

  S._keep=false;
  renderRest();
}

function dayLetters(d){const out=[];sessions().filter(s=>s.data===d).reverse().forEach(s=>{const r=S.rot[s.rotina];const i=r&&r.treinos?r.treinos.findIndex(t=>t.id===s.treino):-1;out.push(i>=0?letter(i):"✓")});return [...new Set(out)].join("")}
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function calCard(td,wk,doneDays){
  const mode=S.cal||"sem", tog=`<div class="seg"><button data-cal="sem" class="${mode==="sem"?"on":""}">Semana</button><button data-cal="mes" class="${mode==="mes"?"on":""}">Mês</button></div>`;
  const dot=(d,lab)=>`<span class="${doneDays.has(d)?"on":""} ${d===td?"today":""} ${d>td?"fut":""}"><i>${doneDays.has(d)?esc(dayLetters(d)):""}</i>${lab}</span>`;
  if(mode==="sem"){
    const n=wk.filter(d=>doneDays.has(d)).length;
    return `<div class="card pad"><div class="row between"><span class="eyebrow">Esta semana · <b class="cnt">${n} ${n===1?"treino":"treinos"}</b></span>${tog}</div><div class="weekdots">${wk.map(d=>dot(d,DOW[parse(d).getDay()])).join("")}</div></div>`;
  }
  const now=new Date(), off=S.calOff||0, m0=new Date(now.getFullYear(),now.getMonth()+off,1), y=m0.getFullYear(), mo=m0.getMonth();
  const nd=new Date(y,mo+1,0).getDate(), lead=(m0.getDay()+6)%7, days=[...Array(nd)].map((_,k)=>ymd(new Date(y,mo,k+1)));
  const past=days.filter(d=>d<=td), n=days.filter(d=>doneDays.has(d)).length;
  const wkAvg=past.length?n/(past.length/7):0;
  const cells=[...Array(lead)].map(()=>`<span class="blank"></span>`).join("")+days.map((d,k)=>dot(d,k+1)).join("");
  return `<div class="card pad"><div class="row between"><span class="row" style="gap:2px"><button class="iconbtn sm" data-calnav="-1" aria-label="Mês anterior">${I("back")}</button><span class="eyebrow">${MESES[mo]}${y!==now.getFullYear()?" "+y:""}</span>${off<0?`<button class="iconbtn sm" data-calnav="1" aria-label="Próximo mês" style="transform:scaleX(-1)">${I("back")}</button>`:""}</span>${tog}</div>
    <div class="weekdots mdots">${["seg","ter","qua","qui","sex","sab","dom"].map(x=>`<em>${x}</em>`).join("")}${cells}</div>
    <div class="sstats"><div><b>${n}</b><span>${n===1?"treino":"treinos"}</span></div><div><b>${past.length?fmtN(Math.round(wkAvg*10)/10):"–"}</b><span>por semana</span></div><div><b>${past.length?Math.round(n/past.length*100)+"%":"–"}</b><span>dos dias</span></div></div></div>`;
}

/* ---------- iniciar treino ---------- */
function startSession(spec){
  const L=live(); if(L){go("ses-"+L.id);return}

  if(spec!=="livre"){
    [rid,tid]=spec.split("|"); const r=S.rot[rid], t=r&&r.treinos.find(x=>x.id===tid);
    if(!t){toast("Treino não encontrado");return}
    const i=r.treinos.indexOf(t); nome=t.nome||("Treino "+letter(i));
    itens=(t.itens||[]).filter(it=>EXo(it.ex)).map(it=>({k:uid(),ex:it.ex,grupo:it.grupo||null,tecnica:it.tecnica||"normal",descanso:it.descanso==null?90:it.descanso,alvo:it.reps||"",obs:it.obs||"",nota:"",sets:[...Array(Math.max(1,+it.series||3))].map(()=>({kg:"",reps:"",ok:false,t:"n"}))}));
  }
  const doc={id,status:"andamento",rotina:rid,treino:tid,nome,data:todayStr(),inicio:new Date().toISOString(),itens,nota:""};
  S.hist[id]=doc; writeNow("ses-"+id,"historico/"+id,doc);
  go("ses-"+id);
}

/* ===== TREINO (ao vivo ou edição) ===== */
function vSes(id){
  const h=S.hist[id];
  if(!h) return `<div class="empty"><b>Treino não encontrado</b><a class="btn small" href="#inicio">Voltar</a></div>`;
  const isLive=h.status==="andamento", st=sesStats(h);
  let out=`<div class="dhead"><a class="iconbtn" href="#${isLive?"inicio":"historico"}" aria-label="Voltar">${I("back")}</a><span class="t">${isLive?"Treino em andamento":"Treino de "+ddmm(h.data)}</span>${isLive?`<button class="btn small" data-finish>Finalizar</button>`:`<button class="iconbtn" data-sesmenu aria-label="Opções">${I("dots")}</button>`}</div>
  <section class="card pad"><input class="title-in" id="ses-nome-${h.id}" data-sesnome value="${esc(h.nome)}" aria-label="Nome do treino">
    <div class="sstats"><div><b ${isLive?"data-clock":""}>${isLive?fmtT(elapsed(h)):(h.duracao||0)+" min"}</b><span>${isLive?"tempo":"duração"}</span></div><div><b>${st.sets}</b><span>séries feitas</span></div><div><b>${fmtVol(st.vol)}</b><span>volume</span></div></div>${isLive?`<button class="linkbtn danger cancelbtn" data-cancel>${I("x")}${S.arm==="cancel"?"Toque de novo para cancelar (nada será salvo)":"Cancelar treino"}</button>`:""}</section>`;
  if(!isLive&&h.recordes&&h.recordes.length) out+=`<div class="note">${I("trophy")}<span><b>Recordes neste treino:</b> ${h.recordes.map(r=>esc(exName(r.ex))+" ("+fmtN(r.kg)+" kg)").join(", ")}</span></div>`;
  if(!h.itens.length) out+=`<div class="empty"><b>Nenhum exercício ainda</b><span>Adicione os exercícios que você vai fazer.</span></div>`;
  let i=0;
  while(i<h.itens.length){
    const it=h.itens[i]; let j=i+1;
    if(it.grupo) while(j<h.itens.length&&h.itens[j].grupo===it.grupo) j++;
    const grp=h.itens.slice(i,j);
    if(grp.length>1) out+=`<div class="bset">${grp.map((g,gi)=>sesItem(h,g,gi===grp.length-1,`${grp.length===2?"Bi-set":grp.length===3?"Tri-set":"Circuito"} ${gi+1}/${grp.length}`)).join("")}</div>`;
    else out+=sesItem(h,it,true);
    i=j;
  }
  out+=`<button class="btn light block" data-sesadd>${I("plus")}Adicionar exercício</button>`;
  out+=`<label class="stack" style="gap:6px"><span class="eyebrow">Observações do treino</span><textarea id="ses-nota-${h.id}" data-sesnota placeholder="Como foi? Dor, energia, algo diferente…">${esc(h.nota||"")}</textarea></label>`;
  if(isLive) out+=`<button class="btn block" data-finish>${I("check")}Finalizar treino</button><button class="btn light block" data-cancel>${S.arm==="cancel"?"Toque de novo para cancelar":"Cancelar treino"}</button>`;
  return out;
}
function sesItem(h,it,lastOfGroup,tag){
  const E=EXo(it.ex), tipo=(E&&E.tipo)||"carga", ref=refFor(it.ex,h,tipo), L=ref.last;
  const tec=TN(it.tecnica), key=h.id+"__"+it.k;
  let rows="";
  it.sets.forEach((s,i)=>{
    rows+=`<button class="stype st-${s.t||"n"}" data-stype="${key}|${i}" aria-label="${STN[s.t||"n"]}, toque para mudar">${STL[s.t||"n"]||(i+1)}</button>
    ${tipo==="tempo"?`<span class="prev"></span>`:`<input inputmode="decimal" id="kg-${key}-${i}" data-set="${key}|${i}|kg" value="${esc(s.kg)}" placeholder="${L&&L.kg?fmtN(L.kg):tipo==="corpo"?"+kg":"kg"}" aria-label="Carga da série ${i+1}">`}
    <input inputmode="numeric" id="rp-${key}-${i}" data-set="${key}|${i}|reps" value="${esc(s.reps)}" placeholder="${L?L.reps:tipo==="tempo"?"seg":"reps"}" aria-label="${tipo==="tempo"?"Segundos":"Repetições"} da série ${i+1}">
    <button class="okb ${s.ok?"on":""}" data-ok="${key}|${i}" aria-pressed="${!!s.ok}" aria-label="Concluir série ${i+1}">${I("check","")}</button>`;
  });
  const meta=[it.alvo?`Meta ${it.sets.length} × ${esc(it.alvo)}`:"",lastOfGroup&&it.descanso?"Descanso "+fmtDesc(it.descanso):""].filter(Boolean).join(" · ");
  const recDiff=ref.rec&&L&&(ref.rec.kg!==L.kg||ref.rec.reps!==L.reps);
  return `<article class="sx" id="it-${it.k}">
    ${tag?`<span class="btag">${I("link")}${tag}</span>`:""}
    <div class="sx-head"><button class="thumb" data-exinfo="${it.ex}" aria-label="Ver ${esc(exName(it.ex))}">${thumb(it.ex,false)}</button>

function startRest(sec,label){if(!sec)return;S.rest={end:Date.now()+sec*1000,total:sec,label};renderRest()}
function renderRest(){
  let el=document.getElementById("rest");
  if(!S.rest){if(el)el.remove();return}
  if(!el){el=document.createElement("div");el.id="rest";el.className="rest inv";el.setAttribute("role","timer");document.body.appendChild(el);
    el.innerHTML=`<div class="ring"><svg viewBox="0 0 56 56"><circle class="bg" cx="28" cy="28" r="23"/><circle class="fg" id="rest-c" cx="28" cy="28" r="23" stroke-dasharray="144.5" stroke-dashoffset="0"/></svg></div><div class="grow"><span class="tm" id="rest-t"></span><span class="lb" id="rest-l"></span></div><button data-r="30">+30s</button><button class="w" data-r="x">Pular</button>`;
    el.querySelector('[data-r="30"]').onclick=()=>{if(S.rest){S.rest.end+=30000;S.rest.total+=30;updateRest()}};
    el.querySelector('[data-r="x"]').onclick=()=>{S.rest=null;renderRest()};}
  updateRest();
}
function updateRest(){
  const el=document.getElementById("rest"); if(!el||!S.rest) return;
  const left=(S.rest.end-Date.now())/1000;
  document.getElementById("rest-t").textContent=left>0?fmtT(left):"Bora!";
  document.getElementById("rest-l").textContent=left>0?"Descanso · "+S.rest.label:"Próxima série";
  document.getElementById("rest-c").setAttribute("stroke-dashoffset",String(144.5*(1-Math.max(0,left)/S.rest.total)));
  if(left<-60){S.rest=null;renderRest()}
}

function picker(title,onDone,multi){
  const picked=[]; let q="", g="all", creating=false;
  sheet("",(ov,close,box)=>{
    const list=()=>Object.entries(S.ex).filter(([k,e])=>(g==="all"||e.grupo===g)&&(!q||(e.nome+" "+GN(e.grupo)).toLowerCase().includes(q))).sort((a,b)=>a[1].nome.localeCompare(b[1].nome,"pt"));

      :`<button class="btn light block" data-pknew>${I("plus")}Criar exercício novo</button>`}

    });

      bindList();

      const n=box.querySelector("[data-pknew]"); if(n)n.onclick=()=>{creating=true;paint();setTimeout(()=>{const x=box.querySelector("#pk-nome");if(x)x.focus()},50)};

        if(!multi){close();onDone([id]);return}
        picked.push(id); creating=false; q=""; paint(); toast("Criado: "+nome);
      };
    };
    paint();
  });
}

function finishSheet(h){

      <button class="btn light" data-x>Continuar treinando</button>
      <button class="linkbtn danger" style="align-self:center" data-discard>${S.arm==="discard"?"Toque de novo para descartar o treino":"Descartar este treino"}</button>`;
      box.querySelectorAll("[data-x]").forEach(b=>b.onclick=close);
      box.querySelectorAll("[data-fm]").forEach(b=>b.onclick=()=>{mode=b.dataset.fm;paint()});
      box.querySelector("[data-discard]").onclick=()=>{if(S.arm!=="discard"){S.arm="discard";paint();setTimeout(()=>{if(S.arm==="discard"){S.arm=null}},4000);return}S.arm=null;delete S.hist[h.id];writeNow("ses-"+h.id,"historico/"+h.id,null,true);S.rest=null;close();toast("Treino descartado");go("inicio")};
      const f=box.querySelector("[data-fin]"); f.onclick=()=>{
        h.itens.forEach(it=>{it.sets=it.sets.filter(s=>{if(num(s.reps)==null)return false;if(!s.ok){if(mode==="all")s.ok=true;else return false}delete s.a_kg;delete s.a_reps;return true})});
        h.itens=h.itens.filter(it=>it.sets.length);
        const rec=[];h.itens.forEach(it=>{const ws=workSets(it);if(!ws.length)return;const mx=Math.max(...ws.map(s=>num(s.kg)||0));if(!mx)return;const prev=exHistory(it.ex).filter(x=>x.ses.id!==h.id);if(prev.length&&mx>Math.max(...prev.map(x=>x.kg)))rec.push({ex:it.ex,kg:mx})});
        h.recordes=rec; h.status="concluido"; h.fim=new Date().toISOString(); h.duracao=Math.max(1,Math.round((Date.parse(h.fim)-Date.parse(h.inicio))/60000));
        writeNow("ses-"+h.id,"historico/"+h.id,h);
        S.rest=null; close(); toast(rec.length?"Treino salvo · "+rec.length+(rec.length===1?" recorde!":" recordes!"):"Treino salvo. Bom trabalho!"); rerender();
      };
    };
    paint();
  });
}

function vTrn([rid,tid]){
  const r=S.rot[rid], t=r&&r.treinos.find(x=>x.id===tid);
  if(!t) return `<div class="empty"><b>Treino não encontrado</b><a class="btn small" href="#rotinas">Voltar</a></div>`;
  const ti=r.treinos.indexOf(t);
  let h=`<div class="dhead"><a class="iconbtn" href="#rot-${rid}" aria-label="Voltar">${I("back")}</a><span class="t">${esc(r.nome)} · Treino ${letter(ti)}</span><button class="btn small" data-start="${rid}|${tid}">${I("play")}Iniciar</button></div>
  <input class="title-in big" id="trn-nome-${tid}" data-trnnome="${rid}|${tid}" value="${esc(t.nome)}" placeholder="Treino ${letter(ti)} (ex.: Glúteo e posterior)" aria-label="Nome do treino">`;
  if(!t.itens.length) h+=`<div class="empty"><b>Treino vazio</b><span>Adicione os exercícios na ordem em que vai fazer.</span></div>`;
  let i=0;
  while(i<t.itens.length){
    const it=t.itens[i]; let j=i+1;
    if(it.grupo) while(j<t.itens.length&&t.itens[j].grupo===it.grupo) j++;
    const grp=t.itens.slice(i,j);
    if(grp.length>1) h+=`<div class="bset">${grp.map((g,gi)=>trnItem(rid,tid,t,i+gi,`${grp.length===2?"Bi-set":grp.length===3?"Tri-set":"Circuito"} ${gi+1}/${grp.length}`)).join("")}</div>`;
    else h+=trnItem(rid,tid,t,i);
    i=j;
  }
  h+=`<button class="btn light block" data-trnadd="${rid}|${tid}">${I("plus")}Adicionar exercícios</button>
  <p class="muted small">Para fazer bi-set, toque em ${I("link","inl")} no primeiro exercício: ele se junta ao de baixo.</p>
  <button class="btn block" data-savetrn="${rid}|${tid}">${I("check")}Salvar treino</button>
  <button class="linkbtn danger" style="align-self:flex-start" data-deltrn="${rid}|${tid}">${S.arm==="tdel"+tid?"Toque de novo para excluir o treino":"Excluir este treino"}</button>`;
  return h;
}
function trnItem(rid,tid,t,i,tag){
  const it=t.itens[i], key=rid+"|"+tid+"|"+i, E=EXo(it.ex), nxt=t.itens[i+1];
  const linked=!!it.grupo&&nxt&&nxt.grupo===it.grupo;
  return `<article class="sx">

function lineChart(pts){
  const W=600,H=230,L=46,R=20,T=26,B=30;
  const ys=pts.map(p=>p.y); let mn=Math.min(...ys),mx=Math.max(...ys);
  if(!isFinite(mn)){mn=0;mx=1}
  const pv=Math.max(1,(mx-mn)*0.15); mn=Math.max(0,Math.floor(mn-pv)); mx=Math.ceil(mx+pv);
  const n=pts.length, X=i=>n===1?(L+(W-L-R)/2):L+i*(W-L-R)/(n-1), Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn||1));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolução">`;
  [0,1,2,3].map(i=>mn+(mx-mn)*i/3).forEach(t=>{s+=`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end">${fmtN(Math.round(t*10)/10)}</text>`});
  (n<=6?pts.map((_,i)=>i):[0,Math.floor((n-1)/2),n-1]).forEach(i=>{s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${ddmm(pts[i].x)}</text>`});
  if(n>1)s+=`<path d="M${X(0)},${Y(pts[0].y)} ${pts.map((p,i)=>"L"+X(i)+","+Y(p.y)).join(" ")} L${X(n-1)},${H-B} L${X(0)},${H-B}Z" fill="var(--sunk)"/>`;
  s+=`<polyline fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p,i)=>X(i)+","+Y(p.y)).join(" ")}"/>`;
  pts.forEach((p,i)=>{const last=i===n-1;s+=`<circle cx="${X(i)}" cy="${Y(p.y)}" r="${last?5.5:3.5}" fill="${last?"var(--ink)":"var(--surface)"}" stroke="var(--ink)" stroke-width="2"/>`;if(last||n<=5)s+=`<text x="${Math.min(W-R-10,Math.max(L+10,X(i)))}" y="${Y(p.y)-11}" text-anchor="middle" style="fill:var(--ink);font-weight:800">${esc(p.lab)}</text>`});
  return s+`</svg>`;
}
function barChart(ws){
  const W=600,H=170,L=10,R=10,T=22,B=26,mx=Math.max(4,...ws.map(w=>w.n)),bw=(W-L-R)/ws.length;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Treinos por semana">`;
  ws.forEach((w,i)=>{const hgt=(H-T-B)*w.n/mx,x=L+i*bw+bw*0.2,y=H-B-hgt,last=i===ws.length-1;
    s+=`<rect x="${x}" y="${H-B-(H-T-B)}" width="${bw*0.6}" height="${H-T-B}" rx="8" fill="var(--sunk)"/>`;
    if(w.n) s+=`<rect x="${x}" y="${y}" width="${bw*0.6}" height="${hgt}" rx="8" fill="${last?"var(--ink)":"var(--muted)"}"/><text x="${x+bw*0.3}" y="${y-6}" text-anchor="middle" style="fill:var(--ink);font-weight:800">${w.n}</text>`;
    s+=`<text x="${x+bw*0.3}" y="${H-8}" text-anchor="middle">${w.lab}</text>`});
  return s+`</svg>`;
}

    on("[data-tecinfo]",b=>{const t=TN(b.dataset.tecinfo);toast(t[1]+": "+t[2])});
    on("[data-itnota]",el=>{const {it}=findIt(el.dataset.itnota);if(it){it.nota=el.value;saveSes(H)}},"oninput");
    on("[data-set]",el=>{
      const [key,iS,f]=el.dataset.set.split("|"), i=+iS, {it}=findIt(key); if(!it) return;

async function shrink(file){
  if(!file||!/^image\//.test(file.type)||/gif|svg/.test(file.type)) return file;
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,1400/Math.max(bmp.width,bmp.height));if(sc===1&&file.size<1.5e6)return file;const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.86))}catch(e){return file}
}

ater entre as repetições.","Sem o aparelho: Abdução com elástico em pé"],"tipo":"carga"},"tke":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Ativa o quadríceps perto do joelho sem carga. É um dos exercícios mais usados na reabilitação de dor no joelho.","fig":"tke","grupo":"mobilidade","midia":null,"nome":"Extensão terminal de joelho com elástico","passos":["Elástico preso num poste na altura do joelho, passando atrás do joelho.","Comece com o joelho levemente dobrado.","Estique o joelho contra o elástico contraindo a coxa da frente e segure 2 s.","Evite: Travar o joelho com força para trás."],"tipo":"corpo"},"bulgaro":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Unilateral: trabalha glúteo e quadríceps de cada perna separadamente e melhora o equilíbrio. Passo longo e tronco inclinado aumentam o glúteo e aliviam o joelho.","fig":"bulgaro","grupo":"quad","midia":null,"nome":"Agachamento búlgaro","passos":["Pé de trás no banco, passo longo.","Tronco levemente inclinado para pegar mais glúteo.","Desça reto e suba pelo pé da frente.","Evite: Deixar o joelho entrar para dentro.","Sem o aparelho: Afundo reverso no smith"],"tipo":"carga"},"hiper45":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Glúteo e lombar baixa com pouca carga e muito controle. Fortalece a parte de trás que segura o tronco nas bolas baixas do beach.","fig":"hiper45","grupo":"gluteo","midia":null,"nome":"Hiperextensão 45° (foco glúteo)","passos":["Apoio na altura do quadril, pés levemente virados para fora.","Arredonde de leve a parte de cima das costas e desça.","Suba contraindo o glúteo até o corpo ficar reto, sem hiperestender a lombar.","Evite: Subir arqueando a lombar.","Sem o aparelho: Elevação pélvica no chão com anilha"],"tipo":"carga"},"pallof":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Core anti-rotação: ensina o tronco a resistir à torção. É a base para transferir a força das pernas para o braço nos golpes.","fig":"pallof","grupo":"core","midia":null,"nome":"Pallof press","passos":["De lado para o cabo, mãos no peito.","Estenda os braços à frente sem deixar o tronco girar.","Segure 2 s e volte.","Evite: Girar o quadril.","Sem o aparelho: Pallof com elástico"],"tipo":"carga"},"flexora":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Isola o posterior na função de dobrar o joelho, que o stiff não cobre. Posterior forte também protege o joelho.","fig":"flexora","grupo":"posterior","midia":null,"nome":"Mesa flexora","passos":["Rolo logo acima do calcanhar e joelho alinhado com o eixo da máquina.","Quadril colado no banco o tempo todo.","Flexione até o fim e desça devagar.","Evite: Levantar o quadril para ajudar.","Sem o aparelho: Cadeira flexora"],"tipo":"carga"},"rotext-cabo":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Fortalece o manguito rotador, que segura o ombro no saque e no smash. Carga baixa, foco em controle.","fig":"rotext-cabo","grupo":"ombro","midia":null,"nome":"Rotação externa no cabo","passos":["Cabo na altura do cotovelo, toalha entre o cotovelo e o corpo.","Gire o antebraço para fora sem afastar o cotovelo.","Bem leve, sem dor.","Evite: Carga alta. É exercício de prevenção.","Sem o aparelho: Rotação externa com elástico"],"tipo":"carga"},"rdl":{"criado":"2026-11-25T12:00:00.000Z","descricao":"É o principal exercício de posterior e glúteo com o músculo alongado, que é onde mais se ganha massa. O joelho fica quase parado, então é seguro mesmo depois do beach.","fig":"rdl","grupo":"posterior","midia":null,"nome":"Stiff / RDL com barra","passos":["Pés na largura do quadril, joelhos levemente flexionados e parados.","Empurre o quadril para trás deslizando a barra rente às coxas.","Desça até sentir o posterior alongar, normalmente pouco abaixo do joelho, com a coluna neutra.","Suba contraindo o glúteo, sem jogar o tronco para trás.","Evite: Arredondar a lombar ou dobrar o joelho a cada repetição.","Sem o aparelho: Stiff com halteres ou no smith"],"tipo":"carga"},"pull-apart":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Ativa a parte de trás do ombro e as escápulas antes de puxar e empurrar.","fig":"pull-apart","grupo":"mobilidade","midia":null,"nome":"Band pull-apart","passos":["Em pé, braços estendidos à frente segurando um elástico na largura dos ombros.","Abra os braços até o elástico encostar no peito, juntando as escápulas.","Volte devagar.","Evite: Subir os ombros em direção às orelhas."],"tipo":"corpo"},"ponte":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Acorda o glúteo antes do treino para ele assumir o trabalho no stiff e no leg, e não a lombar.","fig":"ponte","grupo":"mobilidade","midia":null,"nome":"Ponte glútea no chão","passos":["Deitada de barriga para cima, joelhos dobrados e pés no chão na largura do quadril.","Suba o quadril apertando o glúteo até alinhar joelho, quadril e ombro.","Segure 2 s em cima e desça devagar.","Evite: Subir arqueando a lombar."],"tipo":"corpo"},"barra-assistida":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Na fase de força, a barra assistida é a ponte para fazer barra livre. É o exercício de costas mais completo com o peso do corpo.","fig":"barra-assistida","grupo":"costas","midia":null,"nome":"Barra fixa assistida","passos":["Ajoelhe na plataforma e segure a barra com pegada neutra ou um pouco mais aberta que os ombros.","Puxe até o queixo passar da barra, levando os cotovelos para baixo.","Desça até estender os braços. Registre o contrapeso: aqui a evolução é diminuir esse número.","Evite: Balançar o corpo.","Sem o aparelho: Puxada com pegada neutra"],"tipo":"carga"},"supino-incl-neutro":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Inclinado com pegada neutra trabalha peito alto e ombro da frente com pouco estresse no ombro. Mantém o equilíbrio entre empurrar e puxar.","fig":"supino-incl-neutro","grupo":"peito","midia":null,"nome":"Supino inclinado com halter, pegada neutra","passos":["Banco a 30°, palmas viradas uma para a outra.","Desça até os halteres ficarem ao lado do peito.","Empurre sem bater os halteres.","Evite: Abrir demais os cotovelos.","Sem o aparelho: Supino inclinado na máquina"],"tipo":"carga"},"puxada-neutra":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Base para costas largas, que afinam a cintura visualmente. A pegada neutra poupa o ombro.","fig":"puxada-neutra","grupo":"costas","midia":null,"nome":"Puxada com pegada neutra","passos":["Pegador triângulo ou barra neutra, peito aberto e tronco levemente inclinado.","Puxe levando os cotovelos para baixo, em direção às costelas.","Suba devagar até alongar as costas.","Evite: Puxar com os braços e jogar o tronco para trás.","Sem o aparelho: Barra fixa assistida"],"tipo":"carga"},"panturrilha":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Na areia, a panturrilha e o tendão de Aquiles trabalham muito nos saltos e arranques. Panturrilha forte previne lesão e melhora a impulsão.","fig":"panturrilha","grupo":"panturrilha","midia":null,"nome":"Panturrilha em pé","passos":["Ponta dos pés no degrau, calcanhar livre, joelho estendido.","Desça o calcanhar até alongar bem e segure 1 s embaixo.","Suba o máximo possível e segure 1 s em cima.","Evite: Quicar embaixo.","Sem o aparelho: Panturrilha no leg press"],"tipo":"carga"},"flexora-sentada":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Sentada, o posterior trabalha mais alongado do que na mesa, e os estudos mostram mais ganho de massa nessa versão. Entra a partir da hipertrofia para variar o estímulo.","fig":"flexora-sentada","grupo":"posterior","midia":null,"nome":"Cadeira flexora","passos":["Ajuste o encosto para o joelho ficar alinhado com o eixo da máquina.","Trave bem as coxas com o apoio de cima.","Dobre os joelhos até o fim e volte devagar até quase estender.","Evite: Tirar o quadril do banco para ajudar.","Sem o aparelho: Mesa flexora"],"tipo":"carga"},"peitoral":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Peitoral encurtado puxa o ombro para frente. Alongar ajuda a postura e libera o ombro.","fig":"peitoral","grupo":"alongamento","midia":null,"nome":"Alongamento de peitoral na porta","passos":["Antebraço apoiado no batente da porta, cotovelo na altura do ombro.","Dê um passo à frente com a perna do mesmo lado.","Gire o tronco levemente para o lado oposto até sentir na frente do ombro e no peito.","Evite: Forçar se o ombro beliscar. Abaixe o cotovelo."],"tipo":"tempo"},"scap":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Ensina a escápula a se mover bem, a base de um ombro saudável no supino e na remada.","fig":"scap","grupo":"mobilidade","midia":null,"nome":"Flexão escapular na parede","passos":["Mãos na parede na altura do peito, braços estendidos.","Sem dobrar os cotovelos, deixe o peito ir em direção à parede juntando as escápulas.","Depois empurre a parede afastando as escápulas. O movimento é pequeno.","Evite: Dobrar os cotovelos."],"tipo":"corpo"},"facepull":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Fortalece o ombro de trás e os rotadores externos, que equilibram o saque e o smash. É prevenção de dor no ombro.","fig":"facepull","grupo":"ombro","midia":null,"nome":"Face pull","passos":["Corda na altura dos olhos.","Puxe em direção ao rosto abrindo as mãos e girando os braços para fora.","Segure 1 s atrás.","Evite: Peso alto demais que vira remada.","Sem o aparelho: Crucifixo inverso no cabo"],"tipo":"carga"},"puxada-unilateral":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Um braço de cada vez permite alongar mais a dorsal e corrigir a diferença de força entre os lados.","fig":"puxada-unilateral","grupo":"costas","midia":null,"nome":"Puxada unilateral no cabo","passos":["Ajoelhada ou sentada, cabo alto.","Puxe o cotovelo em direção ao quadril.","Alongue bem em cima.","Evite: Girar o tronco.","Sem o aparelho: Puxada com pegada neutra"],"tipo":"carga"},"goblet":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Aquece o padrão do agachamento e mostra como o joelho está naquele dia antes do hack.","fig":"goblet","grupo":"mobilidade","midia":null,"nome":"Agachamento goblet leve","passos":["Halter ou kettlebell junto ao peito.","Desça devagar entre as pernas, tronco alto.","Suba empurrando o chão. Use para testar a amplitude sem dor do dia.","Evite: Usar carga pesada no aquecimento."],"tipo":"corpo"},"copenhagen":{"criado":"2026-11-25T12:00:00.000Z","descricao":"É o exercício com melhor evidência para prevenir lesão na virilha em esportes com mudança de direção. Substitui a prancha lateral quando você já está mais forte.","fig":"copenhagen","grupo":"core","midia":null,"nome":"Prancha copenhagen","passos":["De lado, antebraço no chão, perna de cima apoiada no banco (no joelho para começar, no pé para avançar).","Suba o quadril até alinhar o corpo.","A perna de baixo fica no chão (mais fácil) ou sobe até o banco (mais difícil). Registre os segundos.","Evite: Deixar o quadril cair ou girar.","Sem o aparelho: Prancha lateral com adução de perna"],"tipo":"tempo"},"quad":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Alivia a tensão do quadríceps e do tendão patelar depois do hack e da extensora.","fig":"quad","grupo":"alongamento","midia":null,"nome":"Alongamento de quadríceps deitada de lado","passos":["Deitada de lado, cabeça apoiada no braço de baixo.","Segure o pé de cima e puxe o calcanhar em direção ao glúteo.","Mantenha os joelhos juntos e o quadril levemente à frente.","Evite: Abrir o joelho para o lado."],"tipo":"tempo"},"triceps-ovh":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Alonga tríceps e dorsal juntos, que trabalharam no treino de braço e costas.","fig":"triceps-ovh","grupo":"alongamento","midia":null,"nome":"Alongamento de tríceps acima da cabeça","passos":["Em pé, leve um braço acima da cabeça e dobre o cotovelo, mão atrás da cabeça.","Com a outra mão, puxe o cotovelo levemente para trás e para o lado.","Incline o tronco um pouco para o lado oposto para pegar também a dorsal.","Evite: Projetar a cabeça para frente."],"tipo":"tempo"},"flexor":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Quem passa muito tempo sentada e treina perna fica com o flexor encurtado, o que puxa a lombar e desliga o glúteo.","fig":"flexor","grupo":"alongamento","midia":null,"nome":"Alongamento do flexor de quadril","passos":["Ajoelhada com uma perna à frente (joelho a 90°) e o outro joelho no chão.","Contraia o glúteo da perna de trás e leve o quadril levemente à frente.","Sinta alongar na frente do quadril da perna de trás.","Evite: Arquear a lombar."],"tipo":"tempo"},"remada-baixa-aberta":{"criado":"2026-11-25T12:00:00.000Z","descricao":"A pegada aberta puxa para a parte de cima das costas e o ombro de trás. Melhora a postura e equilibra o ombro da raquete.","fig":"remada-baixa-aberta","grupo":"costas","midia":null,"nome":"Remada baixa com pegada aberta","passos":["Barra reta com pegada aberta, tronco parado.","Puxe na linha do peito abrindo os cotovelos.","Junte as escápulas no fim e volte devagar.","Evite: Balançar o tronco.","Sem o aparelho: Remada na máquina com pegada aberta"],"tipo":"carga"},"tornozelo":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Tornozelo travado faz o joelho compensar no agachamento. Mais mobilidade aqui alivia o joelho no hack e no búlgaro.","fig":"tornozelo","grupo":"mobilidade","midia":null,"nome":"Mobilidade de tornozelo na parede","passos":["De frente para a parede, um pé a um palmo dela, o outro joelho no chão.","Leve o joelho da frente até encostar na parede, sem tirar o calcanhar do chão.","Volte e repita. Se ficar fácil, afaste o pé um pouco.","Evite: Levantar o calcanhar."],"tipo":"corpo"},"legpress-alto":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Pés altos e abertos tiram o foco do quadríceps e colocam no glúteo. Dá para usar carga alta com a coluna apoiada, sem precisar equilibrar.","fig":"legpress-alto","grupo":"gluteo","midia":null,"nome":"Leg press com pés altos","passos":["Pés no alto da plataforma, um pouco mais abertos que o quadril.","Desça até onde o quadril não sai do banco.","Empurre pelos calcanhares, sem travar o joelho no topo.","Evite: Tirar o quadril do encosto no fim da descida.","Sem o aparelho: Hack de costas para o aparelho"],"tipo":"carga"},"elev-lat-maquina":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Mesma função da elevação com halter, mas com tensão constante e sem impulso. Entra na hipertrofia para você chegar perto da falha com segurança.","fig":"elev-lat-maquina","grupo":"ombro","midia":null,"nome":"Elevação lateral na máquina","passos":["Sente com o peito no apoio e os cotovelos encostados nas almofadas.","Suba levando os cotovelos para fora até a altura do ombro.","Desça em 2 s.","Evite: Encolher o ombro para subir.","Sem o aparelho: Elevação lateral com halter sentada"],"tipo":"carga"},"deadbug":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Core que protege a lombar: ensina a manter a coluna parada enquanto braços e pernas se mexem.","fig":"deadbug","grupo":"core","midia":null,"nome":"Dead bug","passos":["Deitada, braços para cima e joelhos a 90°.","Estenda braço e perna opostos sem tirar a lombar do chão.","Volte e troque o lado.","Evite: Deixar a lombar descolar do chão.","Sem o aparelho: Hollow hold"],"tipo":"corpo"},"crucifixo-inv":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Trabalha o ombro de trás, que costuma ser fraco. Ombro de trás forte melhora a postura e protege a articulação.","fig":"crucifixo-inv","grupo":"ombro","midia":null,"nome":"Crucifixo inverso na máquina","passos":["Peito no apoio, pegada neutra.","Abra os braços pensando em levar as mãos para longe.","Volte devagar.","Evite: Juntar as escápulas e virar remada.","Sem o aparelho: Crucifixo inverso com halter"],"tipo":"carga"},"rotext-elastico":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Aquece o manguito rotador, que é o que mais sofre no ombro de quem joga beach.","fig":"rotext-cabo","grupo":"mobilidade","midia":null,"nome":"Rotação externa com elástico","passos":["Elástico preso na altura do cotovelo, cotovelo colado ao corpo e dobrado a 90°.","Gire o antebraço para fora sem afastar o cotovelo.","Volte devagar.","Evite: Afastar o cotovelo do corpo."],"tipo":"corpo"},"serrote":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Unilateral e apoiada: permite carga alta sem forçar a lombar e corrige a diferença entre os lados, comum em quem joga com um braço só.","fig":"serrote","grupo":"costas","midia":null,"nome":"Remada serrote apoiada","passos":["Mão e joelho no banco, coluna neutra.","Puxe o halter levando o cotovelo em direção ao quadril.","Desça até alongar, sem girar o tronco.","Evite: Girar o tronco para subir o peso.","Sem o aparelho: Remada unilateral no cabo"],"tipo":"carga"},"chop-cabo":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Depois de aprender a resistir à rotação no pallof, o chop treina a rotação com controle, que é o padrão dos golpes no beach.","fig":"chop-cabo","grupo":"core","midia":null,"nome":"Chop no cabo (alto para baixo)","passos":["De lado para o cabo alto, pés afastados, braços estendidos segurando a corda.","Puxe na diagonal até o lado oposto do quadril, girando o tronco junto com o quadril.","Volte devagar controlando a rotação.","Evite: Girar só com os braços ou arquear a lombar.","Sem o aparelho: Chop com elástico"],"tipo":"carga"},"kickback":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Isola o glúteo máximo na extensão do quadril, sem ajuda do quadríceps. Fecha o treino de glúteo com controle.","fig":"kickback","grupo":"gluteo","midia":null,"nome":"Kickback no cabo","passos":["Tornozeleira no cabo baixo, tronco levemente inclinado e mãos apoiadas.","Leve a perna para trás e um pouco para fora, contraindo o glúteo.","Volte devagar sem apoiar o peso.","Evite: Arquear a lombar para ganhar amplitude.","Sem o aparelho: Glúteo na máquina 4 apoios"],"tipo":"carga"},"triceps-corda":{"criado":"2026-11-25T12:00:00.000Z","descricao":"O tríceps é a maior parte do braço. Na corda, com o cotovelo parado, o ombro fica protegido.","fig":"triceps-corda","grupo":"braco","midia":null,"nome":"Tríceps na corda","passos":["Cotovelos colados ao corpo.","Estenda abrindo a corda no fim.","Volte até 90° sem levantar os cotovelos.","Evite: Usar o peso do corpo.","Sem o aparelho: Tríceps com barra no cabo"],"tipo":"carga"},"9090":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Melhora a rotação do quadril. Um quadril que gira bem tira carga do joelho nos deslocamentos do beach.","fig":"9090","grupo":"mobilidade","midia":null,"nome":"Mobilidade 90/90 de quadril","passos":["Sentada no chão, uma perna dobrada à frente (90°) e a outra dobrada ao lado e para trás (90°).","Com o tronco alto, gire os dois joelhos para o outro lado, trocando a posição das pernas.","Use as mãos no chão atrás se precisar. Cada troca conta 1.","Evite: Forçar com dor no joelho. Diminua a amplitude."],"tipo":"corpo"},"elev-lat-cabo":{"criado":"2026-11-25T12:00:00.000Z","descricao":"O cabo mantém tensão no começo do movimento, onde o halter quase não pesa. Complementa a elevação do outro treino.","fig":"elev-lat-cabo","grupo":"ombro","midia":null,"nome":"Elevação lateral no cabo","passos":["Cabo baixo, passando por trás ou pela frente do corpo.","Suba o braço até a altura do ombro.","Desça em 2 s mantendo a tensão.","Evite: Inclinar o tronco para o lado.","Sem o aparelho: Elevação lateral com halter"],"tipo":"carga"},"dorsal":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Depois do treino de costas a dorsal fica encurtada. Alongar devolve a mobilidade do ombro acima da cabeça.","fig":"dorsal","grupo":"alongamento","midia":null,"nome":"Alongamento de dorsal no banco","passos":["Ajoelhada de frente para um banco, cotovelos apoiados nele e mãos juntas.","Leve o quadril para trás em direção aos calcanhares e deixe o peito descer.","Sinta alongar nas laterais das costas e embaixo dos braços.","Evite: Arquear a lombar."],"tipo":"tempo"},"landmine":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Empurrar para cima num ângulo inclinado é bem mais amigável para o ombro do que o desenvolvimento tradicional. Mantém o ombro forte sem irritar.","fig":"landmine","grupo":"ombro","midia":null,"nome":"Desenvolvimento landmine","passos":["Ajoelhada ou em pé, ponta da barra na altura do ombro.","Empurre para cima e à frente, no ângulo da barra.","Desça controlando até o ombro.","Evite: Arquear a lombar para empurrar.","Sem o aparelho: Desenvolvimento com halter e pegada neutra"],"tipo":"carga"},"extensora":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Isola o quadríceps, que protege o joelho. Feita sem travar e com controle, fortalece o tendão em vez de irritar.","fig":"extensora","grupo":"quad","midia":null,"nome":"Cadeira extensora","passos":["Joelho alinhado com o eixo da máquina.","Estenda sem travar e segure 1 s.","Desça devagar.","Evite: Travar o joelho com força no topo.","Sem o aparelho: Extensora unilateral"],"tipo":"carga"},"pombo":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Alonga o glúteo e os rotadores do quadril, que ficam tensos depois do treino de glúteo e das bases do beach.","fig":"pombo","grupo":"alongamento","midia":null,"nome":"Postura do pombo","passos":["A partir de quatro apoios, traga um joelho à frente e deite a canela no chão à sua frente.","Estique a outra perna para trás.","Mantenha o quadril reto e, se der, incline o tronco à frente sobre a perna dobrada.","Evite: Fazer com dor no joelho da frente. Nesse caso use o 90/90 inclinando à frente."],"tipo":"tempo"},"elev-lat-halter":{"criado":"2026-11-25T12:00:00.000Z","descricao":"O deltoide lateral dá o ombro arredondado e faz a cintura parecer mais fina. Por isso aparece nos dois treinos de cima.","fig":"elev-lat-halter","grupo":"ombro","midia":null,"nome":"Elevação lateral com halter","passos":["Leve inclinação à frente, cotovelos levemente dobrados.","Suba levando os cotovelos para fora até a altura do ombro.","Desça em 2 s.","Evite: Usar impulso ou subir acima do ombro.","Sem o aparelho: Elevação lateral na máquina"],"tipo":"carga"},"pull-through":{"criado":"2026-11-25T12:00:00.000Z","descricao":"Mesmo movimento do st const CFG={owner:"tedeschilari-ai",repo:"lari-dados",dir:"treino"};
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const TK="lari.github.token";
const COLS=["exercicios","rotinas","historico","medidas","config"];
S.token=LS.get(TK)||""; S.sync={state:"ok"}; S.photo={};
const b64e=str=>{const bytes=new TextEncoder().encode(str);let bin="";for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin)};
const b64d=b=>{const bin=atob(String(b).replace(/\s/g,""));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)};
class GHErr extends Error{constructor(status,msg){super(msg);this.status=status}}
function ghFetch(path,opts){
  opts=opts||{};
  return fetch(`https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.dir}/${path}`,
    Object.assign({cache:"no-store"},opts,{headers:Object.assign({Authorization:"Bearer "+S.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},opts.headers||{})}));
}
const GH={files:{},pending:{},listeners:{},busy:false,again:false,timer:null,retryT:null,
  loadPending(){try{this.pending=JSON.parse(LS.get("treino4.pending")||"{}")||{}}catch(e){this.pending={}}},
  savePending(){LS.set("treino4.pending",JSON.stringify(this.pending))},
  pendingCount(){return Object.values(this.pending).reduce((a,p)=>a+Object.keys(p||{}).length,0)},
  cache(name){try{const c=JSON.parse(LS.get("treino4.cache."+name)||"null");if(c&&c.data)this.files[name]={data:c.data,sha:c.sha||null,cached:true}}catch(e){}},
  view(name){const f=this.files[name],d=Object.assign({},f?f.data:{}),p=this.pending[name]||{};for(const k in p){if(p[k]===null)delete d[k];else d[k]=p[k]}return d},
  emit(name){(this.listeners[name]||[]).forEach(fn=>fn(this.view(name)))},
  listen(name,fn){(this.listeners[name]=this.listeners[name]||[]).push(fn);if(this.files[name]||this.pending[name])fn(this.view(name))},
  async fetchFile(name){
    const r=await ghFetch(name+".json");
    if(r.status===404) return {data:{},sha:null,missing:true};
    if(!r.ok) throw new GHErr(r.status,"GET "+name+" "+r.status);
    const j=await r.json(); let txt;
    if(j.content&&j.encoding==="base64") txt=b64d(j.content);
    else{const r2=await ghFetch(name+".json",{headers:{Accept:"application/vnd.github.raw+json"}});if(!r2.ok)throw new GHErr(r2.status,"raw "+r2.status);txt=await r2.text()}
    let data={}; try{data=JSON.parse(txt)||{}}catch(e){data={}}
    return {data,sha:j.sha};
  },
  async refresh(names){
    let err=null;
    await Promise.all((names||COLS).map(async n=>{try{const f=await this.fetchFile(n);this.files[n]=f;LS.set("treino4.cache."+n,JSON.stringify(f));this.emit(n)}catch(e){err=e}}));
    if(err) throw err;
    S.lastSync=Date.now();
  },
  set(name,id,doc){
    (this.pending[name]=this.pending[name]||{})[id]=doc===null?null:JSON.parse(JSON.stringify(doc));
    this.savePending(); this.emit(name);
    clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(),700);
    setSync("saving");
  },
  async flush(){
    if(this.busy){this.again=true;return}
    if(!this.pendingCount()){setSync("ok");return}
    this.busy=true; let err=null;
    for(const name of Object.keys(this.pending)){
      if(!this.pending[name]||!Object.keys(this.pending[name]).length){delete this.pending[name];continue}
      for(let attempt=0;attempt<4;attempt++){
        try{
          if(!this.files[name]||this.files[name].cached||attempt>0){this.files[name]=await this.fetchFile(name)}
          const snap=Object.assign({},this.pending[name]||{});
          const data=Object.assign({},this.files[name].data);
          for(const k in snap){if(snap[k]===null)delete data[k];else data[k]=snap[k]}
          const body={message:"treino: "+name+" "+new Date().toISOString().slice(0,16).replace("T"," "),content:b64e(JSON.stringify(data,null,1))};
          if(this.files[name].sha) body.sha=this.files[name].sha;
          const r=await ghFetch(name+".json",{method:"PUT",body:JSON.stringify(body),headers:{"Content-Type":"application/json"}});
          if(r.status===409||r.status===422){err=new GHErr(r.status,"conflito");await new Promise(z=>setTimeout(z,400*(attempt+1)));continue}
          if(!r.ok) throw new GHErr(r.status,"PUT "+name+" "+r.status);
          const j=await r.json();
          this.files[name]={data,sha:j.content&&j.content.sha};
          LS.set("treino4.cache."+name,JSON.stringify(this.files[name]));
          const p=this.pending[name]||{}; for(const k in snap){if(JSON.stringify(p[k])===JSON.stringify(snap[k]))delete p[k]}
          if(!Object.keys(p).length) delete this.pending[name];
          this.savePending(); err=null; break;
        }catch(e){err=e; if(!(e instanceof GHErr)||[401,403,404].includes(e.status)) break}
      }
      if(err) break;
    }
    this.busy=false;
    if(err){
      setSync(err instanceof GHErr?"error":"offline",err);
      clearTimeout(this.retryT); this.retryT=setTimeout(()=>this.flush(),20000);
    }else{S.lastSync=Date.now();setSync(this.pendingCount()?"saving":"ok")}
    if(this.again){this.again=false;this.flush()}
  },
  async putFile(path,blob){
    const dataUrl=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)});
    const content=String(dataUrl).split(",")[1];
    for(let a=0;a<3;a++){
      const r=await ghFetch(path,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:"treino: foto "+path,content})});
      if(r.status===409){await new Promise(z=>setTimeout(z,600));continue}
      if(!r.ok) throw new GHErr(r.status,"upload "+r.status);
      return r.json();
    }
    throw new GHErr(409,"conflito");
  }
};
const ghdb={
  doc:p=>{const [c,id]=p.split("/");return {
    set:d=>{GH.set(c,id,d);return Promise.resolve()},
    delete:()=>{GH.set(c,id,null);return Promise.resolve()},
    onSnapshot:cb=>{GH.listen(c,v=>cb({id,exists:v[id]!=null,data:()=>v[id]}));return()=>{}}}},
  collection:c=>({onSnapshot:cb=>{GH.listen(c,v=>{const docs=Object.keys(v).map(id=>({id,exists:true,data:()=>v[id]}));cb({docs})});return()=>{}}})
};
let syncT=null;
function setSync(state,err){S.sync={state,err};clearTimeout(syncT);if(state==="saving")syncT=setTimeout(paintSync,1200);else paintSync()}
function syncLabel(){
  const st=S.sync||{}, n=GH.pendingCount(), e=st.err;
  if(st.state==="saving") return n?"Salvando…":"";
  if(st.state==="offline") return `Sem conexão · ${n} ${n===1?"alteração guardada":"alterações guardadas"} no aparelho`;
  if(st.state==="error"){
    if(e&&e.status===401) return "A chave do GitHub não vale mais · Ajustes";
    if(e&&(e.status===403||e.status===404)) return "Sem acesso ao lari-dados · Ajustes";
    return "Não consegui salvar · tentando de novo";
  }
  return "";
}
function paintSync(){const el=document.getElementById("sync");if(!el)return;const t=syncLabel();el.hidden=!t;el.textContent=t;el.classList.toggle("bad",S.sync.state==="error")}
function syncText(){
  const t=syncLabel(); if(t) return t;
  if(!S.lastSync) return "Ainda não sincronizou nesta abertura.";
  const m=Math.round((Date.now()-S.lastSync)/60000);
  return m<1?"Tudo salvo. Sincronizado agora.":`Tudo salvo. Sincronizado há ${m} min.`;
}

function fixMedia(){
  document.querySelectorAll('img[src^="gh:"],video[src^="gh:"]').forEach(el=>{
    const p=el.getAttribute("src").slice(3), c=S.photo[p];
    if(c&&c!=="loading"&&c!=="err"){el.src=c;return}
    el.removeAttribute("src");
    if(c) return;
    S.photo[p]="loading";
    ghFetch(p,{headers:{Accept:"application/vnd.github.raw+json"}}).then(r=>{if(!r.ok)throw new GHErr(r.status,"foto");return r.blob()})
      .then(b=>{S.photo[p]=URL.createObjectURL(b);rerender()}).catch(()=>{S.photo[p]="err"});
  });
}
async function testToken(tok){
  try{
    const r=await fetch(`https://api.github.com/repos/${CFG.owner}/${CFG.repo}`,{headers:{Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"},cache:"no-store"});
    if(r.status===401) return {ok:false,msg:"Essa chave não funcionou. Confira se copiou inteira."};
    if(r.status===404||r.status===403) return {ok:false,msg:"A chave funciona, mas não tem acesso ao lari-dados. Confira o passo 3."};
    if(!r.ok) return {ok:false,msg:"O GitHub respondeu com erro "+r.status+". Tente de novo."};
    const j=await r.json();
    if(j.permissions&&j.permissions.push===false) return {ok:false,msg:"A chave só consegue ler. Coloque Contents em Read and write (passo 4)."};
    return {ok:true};
  }catch(e){return {ok:false,msg:"Sem conexão com o GitHub. Confira a internet e tente de novo."}}
}

      <li>Em <b>Permissions</b>, coloque <b>Contents</b> em <b>Read and write</b>.</li>
      <li>Clique em <b>Generate token</b>, copie a chave e cole aqui.</li></ol>
  </div>
  ${S.setupErr?`<p class="small" style="color:var(--warn,#c00)">${esc(S.setupErr)}</p>`:""}
  <button class="btn block" data-connect ${S.connecting?"disabled":""}>${S.connecting?"Conectando…":"Conectar"}</button>`;
}
function bindSetup(){
  const b=app.querySelector("[data-connect]"); if(!b) return;
  b.onclick=async()=>{
    S.setupTok=app.querySelector("#set-token").value.trim();
    if(!S.setupTok){S.setupErr="Cole a chave do GitHub.";render();return}
    S.connecting=true;S.setupErr="";render();
    const res=await testToken(S.setupTok);
    S.connecting=false;
    if(!res.ok){S.setupErr=res.msg;render();return}
    S.token=S.setupTok; S.setupTok="";
    if(!LS.set(TK,S.token)) toast("Este navegador não guardou a chave. Ela vale só até fechar o app.");
    startData(); render();
  };
}
function vAjustes(){
  const n=GH.pendingCount();
  return `<div class="dhead"><a class="iconbtn" href="#inicio" aria-label="Voltar">${I("back")}</a><span class="t">Ajustes</span><span></span></div>
  <div class="card pad"><span class="eyebrow">Seus dados</span><b>GitHub · ${CFG.repo}/${CFG.dir}</b><p class="muted small">${esc(syncText())}${n&&S.sync.state==="ok"?` · ${n} ${n===1?"alteração":"alterações"} esperando`:""}</p><div class="row"><button class="btn small" data-syncnow>Sincronizar agora</button></div></div>
  <div class="card pad"><span class="eyebrow">Instalar como app</span><p class="small">No iPhone, abra no Safari, toque em Compartilhar e depois em <b>Adicionar à Tela de Início</b>. No Android, abra o menu do Chrome e toque em <b>Instalar app</b>.</p></div>
  <div class="card pad"><span class="eyebrow">Este aparelho</span><p class="small muted">Desconectar apaga a chave e a cópia dos dados guardadas neste aparelho. Seus treinos continuam salvos no GitHub.</p><button class="btn light small" data-logout>${S.logoutArm?"Toque de novo para desconectar":"Desconectar deste aparelho"}</button></div>`;
}
function bindAjustes(){
  const q=s=>app.querySelector(s);
  const sn=q("[data-syncnow]"); if(sn)sn.onclick=()=>{sn.disabled=true;GH.refresh().then(()=>{GH.flush();toast("Sincronizado");rerender()}).catch(e=>{setSync(e instanceof GHErr?"error":"offline",e);toast("Não consegui falar com o GitHub agora.");rerender()})};
  const lo=q("[data-logout]"); if(lo)lo.onclick=()=>{
    if(GH.pendingCount()){toast("Ainda tem alterações sem salvar. Sincronize antes de desconectar.");return}
    if(!S.logoutArm){S.logoutArm=true;rerender();setTimeout(()=>{if(S.logoutArm){S.logoutArm=false;rerender()}},4000);return}
    LS.del(TK);LS.del("treino4.pending");COLS.forEach(n=>LS.del("treino4.cache."+n));
    location.hash="";location.reload();
  };
}

/* ---------- início ---------- */
let started=false;
function startData(){
  if(started) return; started=true;
  GH.loadPending(); COLS.forEach(n=>GH.cache(n));
  const db=ghdb; S.db=db; S.ok=true;
  S.assets={upload:async blob=>{
    const ext=((blob.type||"").split("/")[1]||"jpg").replace("jpeg","jpg").replace("quicktime","mov").replace(/[^a-z0-9]/g,"")||"jpg";
    const path="fotos/"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+"."+ext;
    await GH.putFile(path,blob);
    return {id:path,url:"gh:"+path,contentType:blob.type||"image/jpeg"};
  }};
  const coll=(name,fn)=>db.collection(name).onSnapshot(qs=>{const m={};qs.docs.forEach(d=>{if(d.exists)m[d.id]=Object.assign(clone(d.data()),{id:d.id})});fn(m);S.loaded[name]=true;rerender()});
  const keep=(m,cur,pre)=>{Object.keys(S.dirty).forEach(k=>{if(!k.startsWith(pre))return;const id=k.slice(pre.length);if(cur[id])m[id]=cur[id];else delete m[id]})};
  coll("exercicios",m=>{keep(m,S.ex,"ex-");S.ex=m});
  coll("rotinas",m=>{keep(m,S.rot,"rot-");S.rot=m});
  coll("historico",m=>{keep(m,S.hist,"ses-");S.hist=m});
  coll("medidas",m=>{S.med=m});
  db.doc("config/geral").onSnapshot(s=>{S.cfg=s.exists?clone(s.data()):{};rerender()});
  GH.refresh().then(()=>{
    // primeira vez: copia sua biblioteca e suas rotinas para o lari-dados
    if(GH.files.exercicios.missing&&!Object.keys(GH.view("exercicios")).length) Object.entries(SEED.exercicios).forEach(([k,v])=>GH.set("exercicios",k,v));
    if(GH.files.rotinas.missing&&!Object.keys(GH.view("rotinas")).length) Object.entries(SEED.rotinas).forEach(([k,v])=>GH.set("rotinas",k,v));
    if(GH.files.config.missing&&!GH.view("config").geral) GH.set("config","geral",SEED.config);
    ["historico","medidas"].forEach(n=>{if(GH.files[n].missing){S.loaded[n]=true}});
    S.loaded.historico=true;S.loaded.exercicios=true;S.loaded.rotinas=true;rerender();
    if(GH.pendingCount()) GH.flush(); else setSync("ok");
  }).catch(e=>{
    if(!GH.files.exercicios){S.ok=false;S.loadErr=e;render()}
    else{S.loaded.historico=S.loaded.exercicios=S.loaded.rotinas=true;rerender()}
    setSync(e instanceof GHErr?"error":"offline",e);
    if(GH.pendingCount()){clearTimeout(GH.retryT);GH.retryT=setTimeout(()=>GH.flush(),20000)}
  });
  setInterval(()=>{if(document.visibilityState==="visible"&&!GH.busy&&!GH.pendingCount())GH.refresh().catch(()=>{})},90000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!GH.busy){if(GH.pendingCount())GH.flush();else GH.refresh().catch(()=>{})}});
  window.addEventListener("online",()=>{GH.flush()});
}
if(S.token) startData(); else render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

})();

</script>
