<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<meta name="description" content="Treino de musculação da Lari">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Treino">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Treino da Lari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de treino em preto e branco. Celular: telas empilhadas + nav flutuante preta em pílula. Desktop: menu lateral + coluna de 760px. Cartões brancos bem arredondados sobre cinza claro; o "cartão invertido" (preto no claro, branco no escuro) marca o treino do dia. */
:root{
  --bg:#ECECEC; --surface:#FFFFFF; --sunk:#F2F2F2; --ink:#0D0D0D; --muted:#6E6E6E; --line:#E2E2E2;
  --inv:#0D0D0D; --on-inv:#FFFFFF; --inv-muted:#9C9C9C; --inv-sunk:#262626;
  --up:#1F8A4D; --hold:#A36A12; --warn:#C2412D;
  --f:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:24px; --shadow:0 1px 2px rgb(0 0 0 / .04),0 8px 24px rgb(0 0 0 / .05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0A0A; --surface:#161616; --sunk:#202020; --ink:#F2F2F2; --muted:#9A9A9A; --line:#2A2A2A;
  --inv:#F2F2F2; --on-inv:#0A0A0A; --inv-muted:#5E5E5E; --inv-sunk:#DADADA;
  --up:#4CC685; --hold:#E2A64E; --warn:#F07A62; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#161616; --sunk:#202020; --ink:#F2F2F2; --muted:#9A9A9A; --line:#2A2A2A;
  --inv:#F2F2F2; --on-inv:#0A0A0A; --inv-muted:#5E5E5E; --inv-sunk:#DADADA;
  --up:#4CC685; --hold:#E2A64E; --warn:#F07A62; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.87rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
.side{display:none}
.content{width:100%;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;min-width:0}
nav.dock{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 32px));background:var(--inv);color:var(--on-inv);border-radius:999px;padding:7px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;box-shadow:0 10px 30px rgb(0 0 0 / .22)}
nav.dock a{display:flex;align-items:center;justify-content:center;gap:6px;height:46px;border-radius:999px;text-decoration:none;color:var(--inv-muted);font-weight:700;font-size:.78rem;min-width:0}
nav.dock a span{display:none}
nav.dock a.on{background:var(--on-inv);color:var(--inv)}
nav.dock a.on span{display:inline}
nav.dock a.on{grid-column:span 1}
@media (max-width:380px){nav.dock a.on span{display:none}}
.side a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;text-decoration:none;color:var(--muted);font-weight:700}
.side a:hover{background:var(--sunk)}
.side a.on{background:var(--inv);color:var(--on-inv)}
@media (min-width:900px){
  .shell{grid-template-columns:260px 1fr}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:26px 16px;border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;font-weight:800;font-size:1.1rem}
  .side .phase{margin-top:auto;padding:16px;border-radius:20px;background:var(--sunk);display:flex;flex-direction:column;gap:6px}
  nav.dock{display:none}
  .content{padding-block:32px 56px}
}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--inv);color:var(--on-inv);display:grid;place-items:center;font-weight:800;flex:none}

/* header */
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello .who{display:flex;align-items:center;gap:12px;min-width:0}
.hello .who div{display:flex;flex-direction:column;min-width:0}
.hello .who b{font-size:1.05rem}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;text-decoration:none;color:var(--ink)}
.big{font-size:2.05rem}
@media (min-width:640px){.big{font-size:2.5rem}}

/* buttons, pills */
.btn{border:0;border-radius:999px;padding:14px 22px;font-weight:800;background:var(--inv);color:var(--on-inv);font-size:.98rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.light{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.onv{background:var(--on-inv);color:var(--inv)}
.btn.small{padding:9px 15px;font-size:.86rem}
.btn.block{width:100%}
.btn .ico{width:18px;height:18px}
.btn:disabled{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:700;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.pill.dark{background:var(--inv);color:var(--on-inv);border-color:var(--inv)}
.pill.soft{background:var(--sunk);border-color:var(--sunk)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin-inline:-2px}
.chips::-webkit-scrollbar{display:none}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:700;font-size:.88rem;white-space:nowrap;color:var(--ink)}
.chips button.on{background:var(--inv);color:var(--on-inv);border-color:var(--inv)}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:800;font-size:.85rem;color:var(--muted)}
.seg button.on{background:var(--inv);color:var(--on-inv)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dp{border:0;background:var(--surface);border-radius:18px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;box-shadow:var(--shadow)}
.dp .dn{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:capitalize}
.dp .dd{font-size:1.1rem;font-weight:800;line-height:1}
.dp .dt{font-size:.6rem;font-weight:800;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.dp .dot{width:5px;height:5px;border-radius:9px;background:transparent}
.dp .dot.on{background:var(--up)}
.dp.today:not(.sel){outline:2px solid var(--ink);outline-offset:-2px}
.dp.sel{background:var(--inv);color:var(--on-inv)}
.dp.sel .dn,.dp.sel .dt{color:var(--inv-muted)}
.weeknav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.linkbtn{background:none;border:0;padding:4px 0;font-weight:800;font-size:.86rem;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.beach{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border-radius:20px;padding:10px 10px 10px 16px;box-shadow:var(--shadow)}
.beach b{font-size:.92rem}

/* cards */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px;display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 2px}
.sec-h h2{font-size:1.25rem}
.inv{background:var(--inv);color:var(--on-inv)}
.inv .eyebrow,.inv .muted{color:var(--inv-muted)}
.note{background:var(--surface);border-radius:18px;padding:12px 14px;font-size:.9rem;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow)}
.note .ico{width:18px;height:18px;margin-top:2px}

/* hero */
.hero{border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.hero-top{display:grid;grid-template-columns:1fr 132px;gap:8px;align-items:center}
.hero h2{font-size:2.1rem;margin-top:4px}
.hero p{color:var(--inv-muted);font-size:.92rem;margin-top:4px}
.hero-fig{width:132px;height:100px;border-radius:20px;background:var(--inv-sunk);overflow:hidden}
.hero-fig svg{width:100%;height:100%;display:block}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hstats div{background:var(--inv-sunk);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column}
.hstats b{font-size:1.35rem;line-height:1.1}
.hstats span{font-size:.72rem;color:var(--inv-muted);font-weight:600}
.inv .hstats div{color:var(--on-inv)}
.bar{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:9px}
.inv .bar{background:var(--inv-sunk)} .inv .bar i{background:var(--on-inv)}
.clock{font-size:2.3rem;font-weight:800;letter-spacing:-.02em;line-height:1}

/* list items */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:68px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 14px 10px 10px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);border:0;width:100%;text-align:left;color:var(--ink)}
.item.sm{grid-template-columns:56px minmax(0,1fr) auto}
.thumb{width:68px;height:62px;border-radius:16px;background:var(--sunk);overflow:hidden;display:block}
.item.sm .thumb{width:56px;height:50px;border-radius:14px}
.thumb svg{width:100%;height:100%;display:block}
.item .info{display:flex;flex-direction:column;gap:4px;min-width:0}
.item .info b{font-size:1rem;line-height:1.2}
.item .info .sub{font-size:.82rem;color:var(--muted)}
.item .prog{display:flex;align-items:center;gap:8px}
.item .prog .bar{flex:1;max-width:150px}
.item .prog .pc{font-size:.66rem;font-weight:800;background:var(--inv);color:var(--on-inv);border-radius:6px;padding:1px 5px}
.item.skip{opacity:.5}
.tick{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;background:var(--surface);color:var(--muted);flex:none}
.tick.on{background:var(--inv);border-color:var(--inv);color:var(--on-inv)}
.tick svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chev{color:var(--muted)}
.mobrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding-right:12px}
.mobrow .item{box-shadow:none;background:transparent;padding-right:4px;grid-template-columns:56px minmax(0,1fr)}
.blabel{display:flex;align-items:center;gap:8px;padding:4px 4px 0;font-size:.74rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.blabel .t{margin-left:auto;max-width:62%;text-transform:none;letter-spacing:0;font-weight:700;color:var(--ink);font-size:.78rem;text-align:right}
.biset{display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:26px;border:1.5px dashed var(--line)}
.biset .item{box-shadow:none}
details.why{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px}
details.why summary{list-style:none;cursor:pointer;font-weight:800;display:flex;justify-content:space-between;align-items:center}
details.why summary::-webkit-details-marker{display:none}
details.why summary::after{content:"+";font-size:1.2rem}
details.why[open] summary::after{content:"−"}
details.why p{margin-top:8px;font-size:.92rem;color:var(--muted);max-width:65ch}

/* detalhe */
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dhead .t{font-weight:800;font-size:.95rem;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.media{position:relative;background:var(--surface);border-radius:28px;overflow:hidden;aspect-ratio:4/3;max-width:100%;box-shadow:var(--shadow)}
@media (min-width:640px){.media{aspect-ratio:16/10}}
.media svg{width:100%;height:100%;display:block}
.media img,.media video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.media .lbl{position:absolute;left:14px;bottom:14px}
.media .yt{position:absolute;right:14px;top:14px;text-decoration:none}
.dtitle{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dtitle h1{font-size:1.75rem}
.steps{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
.step{flex:0 0 min(78%,300px);scroll-snap-align:start;background:var(--surface);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.step b{font-size:.92rem}
.step p{font-size:.9rem;color:var(--muted)}
.step.alt{background:var(--sunk);box-shadow:none}
.last{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:16px;background:var(--sunk)}
.last .vals{font-weight:800}
.sug{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;padding:12px 14px;border-radius:16px;background:var(--sunk)}
.sug .k{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:999px;flex:none;color:#fff}
.sug.up .k{background:var(--up)} .sug.hold .k{background:var(--hold)} .sug.warn .k{background:var(--warn)} .sug.new .k{background:var(--inv);color:var(--on-inv)}
.sets{display:grid;grid-template-columns:20px 62px minmax(0,1fr) minmax(0,1fr) 46px;gap:7px;align-items:center}
.sets .prev{font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setbtns{display:flex;gap:18px;flex-wrap:wrap}
.sets .h{font-size:.66rem;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.sets .n{font-size:.85rem;font-weight:800;color:var(--muted);text-align:center}
.sets input{width:100%;min-width:0;padding:13px 10px;border:1px solid var(--line);border-radius:14px;background:var(--sunk);font-size:1.05rem;font-weight:700}
.sets input::placeholder{color:var(--muted);opacity:.55;font-weight:600}
.okb{width:46px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.okb.on{background:var(--inv);border-color:var(--inv);color:var(--on-inv)}
.okb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
textarea,.input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--sunk);font-size:.93rem}
textarea{min-height:48px;resize:vertical}
.nextc{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px 10px 10px;border-radius:22px;background:var(--surface);border:0;width:100%;text-align:left;box-shadow:var(--shadow);color:var(--ink)}
.filebtn{position:relative;overflow:hidden}
.nx-photo{width:64px;height:64px;border-radius:14px;object-fit:cover;flex:none}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* descanso */
.rest{position:fixed;z-index:35;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 32px));border-radius:24px;padding:10px 10px 10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgb(0 0 0 / .25)}
.rest .ring{width:56px;height:56px;flex:none;position:relative}
.rest .ring svg{width:56px;height:56px;transform:rotate(-90deg)}
.rest .ring circle{fill:none;stroke-width:5}
.rest .ring .bg{stroke:var(--inv-sunk)} .rest .ring .fg{stroke:var(--on-inv);stroke-linecap:round}
.rest .tm{font-size:1.4rem;font-weight:800;line-height:1}
.rest .lb{font-size:.75rem;color:var(--inv-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.rest .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rest button{border:0;border-radius:999px;padding:10px 12px;font-weight:800;font-size:.82rem;background:var(--inv-sunk);color:var(--on-inv)}
.rest button.w{background:var(--on-inv);color:var(--inv)}
@media (min-width:900px){.rest{bottom:24px;left:calc(50% + 130px)}}
.live{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:25;align-self:center;display:flex;align-items:center;gap:10px;border-radius:999px;padding:6px 6px 6px 14px;box-shadow:0 6px 20px rgb(0 0 0 / .18);font-weight:800;font-size:.9rem;border:0}
.live i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
@media (prefers-reduced-motion:no-preference){.live i{animation:pulse 1.4s infinite}}
@keyframes pulse{50%{opacity:.25}}
.live .btn{padding:7px 12px;font-size:.8rem}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding-top:18px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);align-self:center}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:28px}}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--surface);border:0;text-align:left;width:100%;color:var(--ink)}
.opt.on{outline:2px solid var(--ink);outline-offset:-2px}
.opt span{display:flex;flex-direction:column}
.opt small{color:var(--muted);font-size:.82rem}
.pips{display:flex;gap:8px}
.pips button{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:800}
.pips button.on{background:var(--inv);color:var(--on-inv);border-color:var(--inv)}
input[type=range]{width:100%;accent-color:var(--ink)}

/* outras telas */
.restday{border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:12px}
.restday h2{font-size:2rem}
.wk{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px 12px 12px;border:0;background:var(--surface);border-radius:22px;text-align:left;width:100%;box-shadow:var(--shadow);color:var(--ink)}
.wk .d{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--sunk);border-radius:16px;height:54px}
.wk .d b{font-size:1.1rem;line-height:1}
.wk .d span{font-size:.64rem;font-weight:800;color:var(--muted);text-transform:uppercase}
.wk .w{display:flex;flex-direction:column;gap:2px;min-width:0}
.wk .w span{font-size:.84rem;color:var(--muted)}
.tag{font-size:.7rem;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}

function suggest(exId,rx,last,ci){
  const E=EX(exId)||{}, inc=E.inc||0;
  if(!last) return {c:"new",k:"Novo",t:`Primeira vez: ache uma carga que deixe ${rx.rir==="—"?"um pouco de folga":rx.rir+" repetições sobrando"} e anote.`};
  const sets=(last.sets||[]).filter(s=>s.reps!=null);
  if(!sets.length) return {c:"new",k:"Novo",t:"Sem séries registradas na última vez."};
  const [lo,hi]=range(rx.r), kgs=sets.map(s=>s.kg||0), top=E.inv?Math.min(...kgs):Math.max(...kgs);
  if(ci.fase==="deload") return {c:"hold",k:"Deload",t:top&&!E.inv?`Use ~${fmtKg(Math.round(top*0.9/(inc||1))*(inc||1))} kg, longe da falha.`:"Metade do volume, sem técnicas."};
  if(!inc||!top) return {c:"hold",k:"Meta",t:"Tente +1–2 repetições (ou segundos) em relação à última vez."};
  const atTop=sets.filter(s=>(s.kg||0)===top), avg=atTop.reduce((a,s)=>a+s.reps,0)/atTop.length;
  const allHi=atTop.every(s=>s.reps>=hi)&&atTop.length>=Math.min(2,rx.s);
  if(E.inv){
    if(allHi) return {c:"up",k:"Evoluir",t:`Fechou ${hi} reps em todas. Tire ${fmtKg(inc)} kg do contrapeso (${fmtKg(Math.max(0,top-inc))} kg).`};
    return {c:"hold",k:"Manter",t:`Mantenha ${fmtKg(top)} kg de contrapeso e busque +1 repetição.`};
  }
  if(avg>hi+2){const nk=Math.round(top*1.1/inc)*inc;return {c:"up",k:"Subir",t:`Nova faixa: suba para ~${fmtKg(Math.max(nk,top+inc))} kg e faça ${rx.r}.`}}
  if(allHi) return {c:"up",k:"Subir",t:`Você fechou ${hi} reps em todas. Suba para ${fmtKg(top+inc)} kg.`};
  if(atTop.some(s=>s.reps<lo)) return {c:"warn",k:"Segurar",t:`Mantenha ${fmtKg(top)} kg até fazer pelo menos ${lo} em todas.`};
  return {c:"hold",k:"Manter",t:`Mantenha ${fmtKg(top)} kg e busque +1 repetição por série.`};
}

/* ===== HOJE ===== */
function weekStrip(base){
  const td=todayStr();
  return `<div class="week">${[...Array(7)].map((_,i)=>{const ds=ymd(addDays(base,i)),pl=planFor(ds),d=parse(ds),done=S.logs.some(l=>l.date===ds);
    const lab=pl.t==="LIVRE"?"LIVRE":pl.t?pl.t:(pl.beach?"BEACH":"—");
    return `<button class="dp ${ds===S.sel?"sel":""} ${ds===td?"today":""}" data-day="${ds}" aria-label="${DOWN[pl.k]} ${ddmm(ds)}"><span class="dn">${pl.k}</span><span class="dd">${d.getDate()}</span><span class="dt">${lab}</span><span class="dot ${done?"on":""}"></span></button>`}).join("")}</div>`;
}
function pendente(){
  const td=todayStr(); if(S.sel!==td) return null;
  const mon=monday(new Date()), wd=weekDoc(td), ign=wd.ign||[];
  const doneT=new Set(S.logs.filter(l=>l.date>=ymd(mon)&&l.date<=td).map(l=>l.treino));
  const todayT=planFor(td).t;
  for(let i=0;i<7;i++){const ds=ymd(addDays(mon,i)); if(ds>=td) break;
    const pl=planFor(ds); if(!pl.t||pl.t==="LIVRE"||ign.includes(ds)||S.logs.some(l=>l.date===ds)||doneT.has(pl.t)||pl.t===todayT) continue;
    return {ds,t:pl.t,k:pl.k}}
  return null;
}

function nextCard(id,label,sub){const E=EX(id);return `<span class="eyebrow" style="padding:0 2px">${label}</span><button class="nextc" data-ex="${id}"><span class="thumb" style="width:56px;height:50px">${figOf(id,false)}</span><span class="info" style="display:flex;flex-direction:column"><b>${esc(E.nome)}</b><span class="muted small">${esc(sub||E.grupo)}</span></span>${I("chev")}</button>`}

function startRest(sec,label){S.rest={end:Date.now()+sec*1000,total:sec,label};renderRest()}
function renderRest(){

  if(!el){el=document.createElement("div");el.id="rest";el.className="rest inv";el.setAttribute("role","timer");document.body.appendChild(el);
    el.innerHTML=`<div class="ring"><svg viewBox="0 0 56 56"><circle class="bg" cx="28" cy="28" r="23"/><circle class="fg" id="rest-c" cx="28" cy="28" r="23" stroke-dasharray="144.5" stroke-dashoffset="0"/></svg></div><div class="grow"><span class="tm" id="rest-t"></span><span class="lb" id="rest-l"></span></div><button data-r="30">+30s</button><button class="w" data-r="x">Pular</button>`;

    el.querySelector('[data-r="x"]').onclick=()=>{S.rest=null;renderRest()};}

function updateRest(){
  const el=document.getElementById("rest"); if(!el||!S.rest) return;

async function shrink(file){
  if(!file||!/^image\//.test(file.type)) return file;
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,1280/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.85))}catch(e){return file}
}
const str=(v,max)=>String(v==null?"":v).trim().slice(0,max||400);
function normEx(o,nome,desc){
  o=o&&typeof o==="object"?o:{};

    porque:str(o.porque,400),como:como.length?como:(desc?[str(desc,400)]:["Descreva o movimento na observação do exercício."]),

    certeza:["alta","media","baixa"].includes(o.certeza)?o.certeza:"media",duvida:str(o.duvida,200)};
}

function vMedidas(){
  const M=S.medidas.slice().sort((a,b)=>a.date<b.date?-1:1), f=[["peso","Peso kg"],["cintura","Cintura cm"],["quadril","Quadril cm"],["coxa","Coxa cm"],["gordura","% gordura"]];

  if(M.length){
    h+=`<div class="card tbl-wrap"><table><thead><tr><th>Data</th>${f.map(([,n])=>`<th>${n}</th>`).join("")}</tr></thead><tbody>${M.slice().reverse().map(m=>`<tr><td class="num">${ddmm(m.date)}</td>${f.map(([k])=>`<td class="num">${m[k]!=null?fmtKg(m[k]):"–"}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

function lineChart(pts,noE){

  const ys=pts.map(p=>p.y).concat(noE?[]:pts.map(p=>p.e||0)).filter(v=>v>0);
  let mn=Math.min(...ys),mx=Math.max(...ys); if(!isFinite(mn)){mn=0;mx=1}
  const pv=Math.max(1,(mx-mn)*0.15); mn=Math.max(0,Math.floor(mn-pv)); mx=Math.ceil(mx+pv);
  const n=pts.length, X=i=>n===1?(L+(W-L-R)/2):L+i*(W-L-R)/(n-1), Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn||1));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolução">`;
  [0,1,2,3].map(i=>mn+(mx-mn)*i/3).forEach(t=>{s+=`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end">${fmtKg(Math.round(t*10)/10)}</text>`});
  (n<=6?pts.map((_,i)=>i):[0,Math.floor((n-1)/2),n-1]).forEach(i=>{s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${ddmm(pts[i].x)}</text>`});
  if(!noE&&pts.some(p=>p.e))s+=`<polyline fill="none" stroke="var(--muted)" stroke-opacity=".6" stroke-width="2" stroke-dasharray="4 4" points="${pts.map((p,i)=>X(i)+","+Y(p.e||p.y)).join(" ")}"/>`;
  if(n>1)s+=`<path d="M${X(0)},${Y(pts[0].y)} ${pts.map((p,i)=>"L"+X(i)+","+Y(p.y)).join(" ")} L${X(n-1)},${H-B} L${X(0)},${H-B}Z" fill="var(--sunk)"/>`;
  s+=`<polyline fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p,i)=>X(i)+","+Y(p.y)).join(" ")}"/>`;
  pts.forEach((p,i)=>{const last=i===n-1;s+=`<circle cx="${X(i)}" cy="${Y(p.y)}" r="${last?5.5:3.5}" fill="${last?"var(--ink)":"var(--surface)"}" stroke="var(--ink)" stroke-width="2"/>`;if(last||n<=6)s+=`<text x="${X(i)}" y="${Y(p.y)-11}" text-anchor="middle" style="fill:var(--ink);font-weight:800">${esc(p.lab)}</text>`});
  return s+`</svg>`;
}
function spark(v){
  const W=72,H=26; if(v.length<2) return `<svg width="${W}" height="${H}" aria-hidden="true"></svg>`;
  const mn=Math.min(...v),mx=Math.max(...v), pts=v.map((y,i)=>[i*(W-6)/(v.length-1)+3,H-4-(H-8)*((y-mn)/((mx-mn)||1))]);
  return `<svg width="${W}" height="${H}" aria-hidden="true"><polyline fill="none" stroke="var(--ink)" stroke-width="2" points="${pts.map(p=>p.join(",")).join(" ")}"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3" fill="var(--ink)"/></svg>`;
}

function persistLog(exId,ds,loud){
  const key=ds+"__"+exId, d=draftFor(key,exId);
  const sets=d.sets.map(s=>({kg:num(s.kg),reps:num(s.reps)})).filter(s=>s.reps!=null).map(s=>({kg:s.kg==null?0:s.kg,reps:Math.round(s.reps)}));
  if(!sets.length){if(loud)toast("Preencha as repetições de pelo menos uma série");return false}
  const D=dayPlan(ds), it=D.items.find(x=>x.id===exId), rxn=it?rxFor(it.papel,D.ci,D.T).s:0;
  const doc={date:ds,ex:exId,treino:D.t||"",bloco:it?it.code:"",n:d.n||Math.max(rxn,sets.length),semana:D.ci.cw,ciclo:S.prog.ciclo,fase:D.ci.fase,sets,nota:(d.nota||"").trim(),ts:new Date().toISOString()};
  const i=S.logs.findIndex(l=>l.id===key); if(i>=0)S.logs[i]=Object.assign({id:key},doc); else S.logs.push(Object.assign({id:key},doc));
  write("logs/"+key,doc).then(()=>{if(loud)toast("Exercício registrado")}).catch(fail);
  return true;
}

  cache(name){try{const c=JSON.parse(LS.get("treino.cache."+name)||"null");if(c&&c.data)this.files[name]={data:c.data,sha:c.sha||null,cached:true}}catch(e){}},
  view(name){const f=this.files[name],d=Object.assign({},f?f.data:{}),p=this.pending[name]||{};for(const k in p){if(p[k]===null)delete d[k];else d[k]=p[k]}return d},
  emit(name){(this.listeners[name]||[]).forEach(fn=>fn(this.view(name)))},
  listen(name,fn){(this.listeners[name]=this.listeners[name]||[]).push(fn);if(this.files[name]||this.pending[name])fn(this.view(name))},
  async fetchFile(name){
    const r=await ghFetch(name+".json");
    if(r.status===404) return {data:{},sha:null};
    if(!r.ok) throw new GHErr(r.status,"GET "+name+" "+r.status);
    const j=await r.json(); let txt;
    if(j.content&&j.encoding==="base64") txt=b64d(j.content);
    else{const r2=await ghFetch(name+".json",{headers:{Accept:"application/vnd.github.raw+json"}});if(!r2.ok)throw new GHErr(r2.status,"raw "+r2.status);txt=await r2.text()}
    let data={}; try{data=JSON.parse(txt)||{}}catch(e){data={}}
    return {data,sha:j.sha};
  },
  async refresh(names){
    let err=null;
    await Promise.all((names||COLS).map(async n=>{try{const f=await this.fetchFile(n);this.files[n]=f;LS.set("treino.cache."+n,JSON.stringify(f));this.emit(n)}catch(e){err=e}}));
    if(err) throw err;
    S.lastSync=Date.now();
  },
  set(name,id,doc){
    (this.pending[name]=this.pending[name]||{})[id]=doc===null?null:JSON.parse(JSON.stringify(doc));
    this.savePending(); this.emit(name);
    clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(),700);
    setSync("saving");
  },
  async flush(){
    if(this.busy){this.again=true;return}
    if(!this.pendingCount()){setSync("ok");return}
    this.busy=true; let err=null;
    for(const name of Object.keys(this.pending)){
      if(!this.pending[name]||!Object.keys(this.pending[name]).length){delete this.pending[name];continue}
      for(let attempt=0;attempt<4;attempt++){
        try{
          if(!this.files[name]||this.files[name].cached||attempt>0){this.files[name]=await this.fetchFile(name)}
          const snap=Object.assign({},this.pending[name]||{});
          const data=Object.assign({},this.files[name].data);
          for(const k in snap){if(snap[k]===null)delete data[k];else data[k]=snap[k]}
          const body={message:"treino: "+name+" "+new Date().toISOString().slice(0,16).replace("T"," "),content:b64e(JSON.stringify(data,null,1))};
          if(this.files[name].sha) body.sha=this.files[name].sha;
          const r=await ghFetch(name+".json",{method:"PUT",body:JSON.stringify(body),headers:{"Content-Type":"application/json"}});
          if(r.status===409||r.status===422){err=new GHErr(r.status,"conflito");await new Promise(z=>setTimeout(z,400*(attempt+1)));continue}
          if(!r.ok) throw new GHErr(r.status,"PUT "+name+" "+r.status);
          const j=await r.json();
          this.files[name]={data,sha:j.content&&j.content.sha};
          LS.set("treino.cache."+name,JSON.stringify(this.files[name]));
          const p=this.pending[name]||{}; for(const k in snap){if(p[k]===snap[k])delete p[k]}
          if(!Object.keys(p).length) delete this.pending[name];
          this.savePending(); err=null; break;
        }catch(e){err=e; if(!(e instanceof GHErr)||[401,403,404].includes(e.status)) break}
      }
      if(err) break;
    }
    this.busy=false;
    if(err){
      setSync(err instanceof GHErr?"error":"offline",err);
      clearTimeout(this.retryT); this.retryT=setTimeout(()=>this.flush(),20000);
    }else{S.lastSync=Date.now();setSync(this.pendingCount()?"saving":"ok")}
    if(this.again){this.again=false;this.flush()}
  },
  async putFile(path,blob){
    const dataUrl=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)});
    const content=String(dataUrl).split(",")[1];
    for(let a=0;a<3;a++){
      const r=await ghFetch(path,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:"treino: foto "+path,content})});
      if(r.status===409){await new Promise(z=>setTimeout(z,600));continue}
      if(!r.ok) throw new GHErr(r.status,"upload "+r.status);
      return r.json();
    }
    throw new GHErr(409,"conflito");
  }
};
const ghdb={
  doc:p=>{const [c,id]=p.split("/");return {
    set:d=>{GH.set(c,id,d);return Promise.resolve()},
    delete:()=>{GH.set(c,id,null);return Promise.resolve()},
    onSnapshot:cb=>{GH.listen(c,v=>cb({id,exists:v[id]!=null,data:()=>v[id],metadata:{}}));return()=>{}}}},
  collection:c=>({onSnapshot:cb=>{GH.listen(c,v=>{const docs=Object.keys(v).map(id=>({id,exists:true,data:()=>v[id],metadata:{}}));cb({docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}})});return()=>{}}})
};
let syncT=null;
function setSync(state,err){
  S.sync={state,err};
  clearTimeout(syncT);
  if(state==="saving") syncT=setTimeout(paintSync,1200); else paintSync();
}
function syncLabel(){
  const st=S.sync||{}, n=GH.pendingCount(), e=st.err;
  if(st.state==="saving") return n?"Salvando…":"";
  if(st.state==="offline") return `Sem conexão · ${n} ${n===1?"alteração guardada":"alterações guardadas"}`;
  if(st.state==="error"){
    if(e&&e.status===401) return "A chave do GitHub não vale mais · Ajustes";
    if(e&&(e.status===403||e.status===404)) return "Sem acesso ao lari-dados · Ajustes";
    return "Não consegui salvar · tentando de novo";
  }
  return "";
}
function paintSync(){
  const el=document.getElementById("sync"); if(!el) return;
  const t=syncLabel(); el.hidden=!t; el.textContent=t;
  el.classList.toggle("bad",S.sync.state==="error");
}
function syncText(){
  const t=syncLabel(); if(t) return t;
  if(!S.lastSync) return "Ainda não sincronizou nesta abertura.";
  const m=Math.round((Date.now()-S.lastSync)/60000);
  return m<1?"Tudo salvo. Sincronizado agora.":`Tudo salvo. Sincronizado há ${m} min.`;
}
function mediaUrl(md){
  if(md.url&&/^(https?:|blob:)/.test(md.url)) return md.url;
  const p=md.id; if(!p) return null;
  const c=S.photo[p];
  if(c&&c!=="loading"&&c!=="err") return c;
  if(!c){
    S.photo[p]="loading";
    ghFetch(p,{headers:{Accept:"application/vnd.github.raw+json"}})
      .then(r=>{if(!r.ok)throw new GHErr(r.status,"foto");return r.blob()})
      .then(b=>{S.photo[p]=URL.createObjectURL(md.type?new Blob([b],{type:md.type}):b);rerender()})
      .catch(()=>{S.photo[p]="err"});
  }
  return null;
}
function makeSample(key){
  const call=async(prompt,opts)=>{
    opts=opts||{}; const content=[];
    for(const img of (opts.images||[])){
      const du=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(img)});
      const [h,data]=String(du).split(",");
      content.push({type:"image",source:{type:"base64",media_type:(h.match(/data:([^;]+)/)||[])[1]||"image/jpeg",data}});
    }
    content.push({type:"text",text:prompt});
    let r;
    try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:1500,messages:[{role:"user",content}]})})}
    catch(e){throw {code:"network",message:String(e)}}
    if(r.status===401||r.status===403) throw {code:"not_granted",message:"chave"};
    if(r.status===429) throw {code:"rate_limited",message:"limite"};
    if(!r.ok) throw {code:"error",message:"HTTP "+r.status};
    const j=await r.json();
    return {text:(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join(""),truncated:j.stop_reason==="max_tokens"};
  };
  const s=(p,o)=>call(p,o);
  s.json=async(p,o)=>{const {text}=await call(p,o);const a=text.indexOf("{"),b=text.lastIndexOf("}");if(a<0||b<a)throw {code:"error",message:"sem JSON"};return JSON.parse(text.slice(a,b+1))};
  s.limits=async()=>({images:{maxCount:1}});
  return s;
}
async function testToken(tok){
  try{
    const r=await fetch(`https://api.github.com/repos/${CFG.owner}/${CFG.repo}`,{headers:{Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"},cache:"no-store"});
    if(r.status===401) return {ok:false,msg:"Essa chave não funcionou. Confira se copiou inteira."};
    if(r.status===404||r.status===403) return {ok:false,msg:"A chave funciona, mas não tem acesso ao lari-dados. Confira o passo 3."};
    if(!r.ok) return {ok:false,msg:"O GitHub respondeu com erro "+r.status+". Tente de novo."};
    const j=await r.json();
    if(j.permissions&&j.permissions.push===false) return {ok:false,msg:"A chave só consegue ler. Coloque Contents em Read and write (passo 4)."};
    return {ok:true};
  }catch(e){return {ok:false,msg:"Sem conexão com o GitHub. Confira a internet e tente de novo."}}
}

/* ---------- conexão e ajustes ---------- */
function vSetup(){
  return `<header class="hello"><div class="who"><span class="avatar">L</span><div><b>Treino da Lari</b><span class="muted small">Primeiro acesso neste aparelho</span></div></div></header>
  <h1 class="big">Conectar seus dados</h1>
  <p class="muted" style="max-width:60ch">O app guarda seus treinos no repositório privado <b>lari-dados</b>, no seu GitHub. Para ler e salvar lá, ele precisa de uma chave de acesso. A chave fica guardada só neste aparelho.</p>
  <div class="card pad">
    <label class="stack" style="gap:6px"><span class="eyebrow">Chave do GitHub</span><input class="input" id="set-token" type="password" autocomplete="off" placeholder="github_pat_…" value="${esc(S.setupTok||"")}"></label>
    <details class="why" style="box-shadow:none;background:var(--sunk)"><summary>Como criar a chave</summary><ol class="small" style="margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink)">
      <li>Abra <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener"><b>a página de nova chave do GitHub</b></a>, logada na conta tedeschilari-ai.</li>
      <li>Em <b>Token name</b>, coloque "App Treino". Em <b>Expiration</b>, escolha um prazo longo, como 1 ano.</li>
      <li>Em <b>Repository access</b>, escolha <b>Only select repositories</b> e marque <b>lari-dados</b>.</li>
      <li>Em <b>Permissions</b>, abra <b>Repository permissions</b> e coloque <b>Contents</b> em <b>Read and write</b>.</li>
      <li>Clique em <b>Generate token</b>, copie a chave e cole aqui.</li></ol></details>
  </div>
  <div class="card pad">
    <label class="stack" style="gap:6px"><span class="eyebrow">Chave da API do Claude (opcional)</span><input class="input" id="set-ai" type="password" autocomplete="off" placeholder="sk-ant-…" value="${esc(S.setupAi||"")}"></label>
    <p class="muted small">Serve só para identificar exercícios novos pelo nome ou pela foto. Você cria em <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener"><b>console.anthropic.com</b></a>. É cobrado por uso, centavos por identificação. Sem ela, dá para cadastrar exercícios escrevendo a descrição. Também dá para colocar depois, em Ajustes.</p>
  </div>
  ${S.setupErr?`<p class="small" style="color:var(--warn)">${esc(S.setupErr)}</p>`:""}
  <button class="btn block" data-connect ${S.connecting?"disabled":""}>${S.connecting?"Conectando…":"Conectar"}</button>`;
}
function bindSetup(){
  const b=app.querySelector("[data-connect]"); if(!b) return;
  b.onclick=async()=>{
    S.setupTok=app.querySelector("#set-token").value.trim(); S.setupAi=app.querySelector("#set-ai").value.trim();
    if(!S.setupTok){S.setupErr="Cole a chave do GitHub.";render();return}
    S.connecting=true;S.setupErr="";render();
    const res=await testToken(S.setupTok);
    S.connecting=false;
    if(!res.ok){S.setupErr=res.msg;render();return}
    S.token=S.setupTok; S.aikey=S.setupAi; S.setupTok=S.setupAi="";
    const saved=LS.set(TK,S.token); if(S.aikey)LS.set(AK,S.aikey);
    if(!saved) toast("Este navegador não guardou a chave. Ela vale só até fechar o app.");
    startData(); render();
  };
}
function vAjustes(){
  const n=GH.pendingCount();
  return `<h1 class="big">Ajustes</h1>
  <div class="card pad"><span class="eyebrow">Seus dados</span><b>GitHub · ${CFG.repo}/${CFG.dir}</b><p class="muted small">${esc(syncText())}${n&&S.sync.state==="ok"?` · ${n} ${n===1?"alteração":"alterações"} esperando`:""}</p><div class="row"><button class="btn small" data-syncnow>Sincronizar agora</button></div></div>
  <div class="card pad"><span class="eyebrow">Identificar exercícios novos</span><p class="small">${S.aikey?"A chave da API do Claude está configurada neste aparelho.":"Sem chave da API do Claude. Exercícios novos são salvos com a sua descrição."}</p>
    <input class="input" id="set-ai2" type="password" autocomplete="off" placeholder="${S.aikey?"Trocar chave (sk-ant-…)":"Colar chave (sk-ant-…)"}">
    <div class="row"><button class="btn small" data-saveai>Salvar chave</button>${S.aikey?`<button class="btn light small" data-rmai>Remover chave</button>`:""}</div></div>
  <div class="card pad"><span class="eyebrow">Instalar como app</span><p class="small">No iPhone, abra no Safari, toque em Compartilhar e depois em <b>Adicionar à Tela de Início</b>. No Android, abra o menu do Chrome e toque em <b>Instalar app</b>.</p></div>
  <div class="card pad"><span class="eyebrow">Este aparelho</span><p class="small muted">Desconectar apaga a chave do GitHub e a cópia dos dados guardadas neste aparelho. Seus treinos continuam salvos no GitHub.</p><button class="btn light small" data-logout>${S.logoutArm?"Toque de novo para desconectar":"Desconectar deste aparelho"}</button></div>`;
}
function bindAjustes(){
  const q=s=>app.querySelector(s);
  const sn=q("[data-syncnow]"); if(sn)sn.onclick=()=>{sn.disabled=true;GH.refresh().then(()=>{GH.flush();toast("Sincronizado");rerender()}).catch(e=>{setSync(e instanceof GHErr?"error":"offline",e);toast("Não consegui falar com o GitHub agora.");rerender()})};
  const sa=q("[data-saveai]"); if(sa)sa.onclick=()=>{const v=q("#set-ai2").value.trim();if(!v){toast("Cole a chave primeiro");return}S.aikey=v;LS.set(AK,v);S.sample=makeSample(v);S.sampleImg=true;toast("Chave salva");rerender()};
  const ra=q("[data-rmai]"); if(ra)ra.onclick=()=>{LS.del(AK);S.aikey="";S.sample=null;S.sampleImg=false;toast("Chave removida");rerender()};
  const lo=q("[data-logout]"); if(lo)lo.onclick=()=>{
    if(GH.pendingCount()){toast("Ainda tem alterações sem salvar. Sincronize antes de desconectar.");return}
    if(!S.logoutArm){S.logoutArm=true;rerender();setTimeout(()=>{if(S.logoutArm){S.logoutArm=false;rerender()}},4000);return}
    LS.del(TK);LS.del(AK);LS.del("treino.pending");COLS.forEach(n=>LS.del("treino.cache."+n));
    location.hash="";location.reload();
  };
}

/* ---------- início ---------- */
let started=false;
function startData(){
  if(started) return; started=true;
  GH.loadPending(); COLS.forEach(n=>GH.cache(n));
  const db=ghdb; S.db=db; S.ok=true;
  S.assets={upload:async blob=>{
    const ext=((blob.type||"").split("/")[1]||"jpg").replace("jpeg","jpg").replace("quicktime","mov").replace(/[^a-z0-9]/g,"")||"jpg";
    const path="fotos/"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+"."+ext;
    await GH.putFile(path,blob);
    return {id:path,url:"",contentType:blob.type||"image/jpeg"};
  }};
  if(S.aikey){S.sample=makeSample(S.aikey);S.sampleImg=true}
  const coll=(name,fn)=>db.collection(name).onSnapshot(qs=>{fn(qs.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data())));rerender()});
  db.doc("programa/atual").onSnapshot(s=>{const first=!S.progLoaded;S.progRaw=s.exists?s.data():null;mergeProg();S.progLoaded=true;if(first){const h=decodeURIComponent(location.hash.slice(1));const m=h.match(/^ex-(.+)$/);if(m&&EX(m[1]))S.detail=m[1]}rerender()});
  coll("logs",a=>{S.logs=a});
  coll("sessoes",a=>{S.sessoes={};a.forEach(d=>S.sessoes[d.id]=d)});
  coll("semanas",a=>{S.semanas={};a.forEach(d=>S.semanas[d.id]=d)});
  coll("medidas",a=>{S.medidas=a});
  coll("feedback",a=>{S.feedback=a});
  coll("midia",a=>{S.midia={};a.forEach(d=>S.midia[d.id]=d)});
  coll("custom",a=>{S.custom={};a.forEach(d=>{S.custom[d.id]=d});mergeProg()});
  GH.refresh().then(()=>{
    if(!GH.view("programa").atual) GH.set("programa","atual",SEED);
    if(GH.pendingCount()) GH.flush(); else setSync("ok");
  }).catch(e=>{
    if(!GH.files.programa){S.ok=false;S.loadErr=e;render()}
    setSync(e instanceof GHErr?"error":"offline",e);
    if(GH.pendingCount()){clearTimeout(GH.retryT);GH.retryT=setTimeout(()=>GH.flush(),20000)}
  });
  setInterval(()=>{if(document.visibilityState==="visible"&&!GH.busy)GH.refresh().catch(()=>{})},90000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!GH.busy){GH.refresh().catch(()=>{});if(GH.pendingCount())GH.flush()}});
  window.addEventListener("online",()=>{GH.flush();GH.refresh().catch(()=>{})});
}
if(S.token) startData();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

if(!S.token) render();
})();
